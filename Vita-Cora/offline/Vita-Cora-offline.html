       const fill = step === 1 ? Math.min(height, Math.round(phase * height) + 4) : height;\n        rect(x, 124 - fill, 14, fill, index % 2 ? GOLD : MINT);\n      }\n      line([[183, 125], [310, 125]], OUTLINE);\n    }\n    const label = step === 0 ? \"Laboratorio\" : step === 2 ? \"Análisis especializado\" : cellular ? \"Células y señales\" : microbiome ? \"Microorganismos\" : \"Sustancias medidas\";\n    badge(label, 171, 169, 147);\n  }\n\n  const artwork = { actigrafia: actigraphy, sueno: questionnaires, cognicion: cognition, equilibrio: balance, personalidad: questionnaires, marcadores: labs, carotida: carotid, celulas: labs, microbioma: labs }[kind];\n\n  return (step, phase) => {\n    const { width, height } = canvas.getBoundingClientRect();\n    if (!width || !height) return;\n    cssWidth = width;\n    const density = window.devicePixelRatio || 1;\n    const pixelWidth = Math.round(width * density);\n    const pixelHeight = Math.round(height * density);\n    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {\n      canvas.width = pixelWidth;\n      canvas.height = pixelHeight;\n    }\n    ctx.setTransform(pixelWidth / WIDTH, 0, 0, pixelHeight / HEIGHT, 0, 0);\n    ctx.lineJoin = \"round\";\n    ctx.lineCap = \"round\";\n    cabin();\n    artwork(step, phase);\n  };\n}\n\nreturn { makeMeasurementArt };\n})();\nmodules[\"mediciones.js\"] = (() => {\nconst { makeMeasurementArt } = modules[\"mediciones-arte.js\"];\n\nconst SCENES = {\n  actigrafia: [\n    \"El tripulante lleva un monitor en la muñeca.\",\n    \"El monitor registra el movimiento y la luz a lo largo del día.\",\n    \"El equipo usa esos registros para estudiar los horarios de sueño.\"\n  ],\n  sueno: [\n    \"Al despertar, el tripulante anota cuánto y cómo durmió.\",\n    \"Antes de dormir, responde preguntas sobre ánimo y convivencia.\",\n    \"El equipo compara el relato de sueño con el registro del monitor.\"\n  ],\n  cognicion: [\n    \"El tripulante responde a estímulos que aparecen en la pantalla.\",\n    \"Distintas tareas exploran habilidades como atención y memoria.\",\n    \"El equipo de investigación revisa los resultados de las pruebas.\"\n  ],\n  equilibrio: [\n    \"El personal prepara una evaluación de movimiento y equilibrio.\",\n    \"La figura ilustra un cambio de postura que el equipo puede observar.\",\n    \"El personal también puede registrar el pulso y la presión.\"\n  ],\n  personalidad: [\n    \"Antes del vuelo, cada tripulante responde un cuestionario.\",\n    \"Las respuestas describen cómo suele actuar y relacionarse.\",\n    \"NASA usa el cuestionario como contexto para su investigación sobre equipos.\"\n  ],\n  marcadores: [\n    \"El laboratorio recibe muestras de sangre y orina del estudio.\",\n    \"Los marcadores son sustancias que se pueden medir en las muestras.\",\n    \"El equipo especializado interpreta los resultados con el contexto del estudio.\"\n  ],\n  carotida: [\n    \"El equipo capacitado observa una arteria del cuello con un ecógrafo.\",\n    \"La pantalla muestra un esquema de sus paredes.\",\n    \"Las marcas indican el grosor de una pared en el esquema.\"\n  ],\n  celulas: [\n    \"El laboratorio estudia muestras de sangre y saliva.\",\n    \"El esquema representa células y otras señales que se analizan.\",\n    \"El equipo estudia cómo cambia la respuesta del cuerpo durante el vuelo.\"\n  ],\n  microbioma: [\n    \"El laboratorio recibe las muestras recogidas para el estudio.\",\n    \"Los símbolos representan distintos microorganismos del cuerpo.\",\n    \"Los investigadores comparan cómo cambia esa comunidad durante la misión.\"\n  ]\n};\nconst STEP_MS = 2500;\nconst motion = window.matchMedia(\"(prefers-reduced-motion: reduce)\");\n\nfunction element(tag, className, content = \"\") {\n  const node = document.createElement(tag);\n  if (className) node.className = className;\n  node.textContent = content;\n  return node;\n}\n\nfunction button(label, action) {\n  const control = element(\"button\", \"button quiet\", label);\n  control.type = \"button\";\n  control.addEventListener(\"click\", action);\n  return control;\n}\n\nfunction mountScene(card) {\n  const captions = SCENES[card.dataset.medida];\n  const subject = card.querySelector(\"summary strong\").textContent;\n  const scene = element(\"figure\", \"measure-scene\");\n  const canvas = element(\"canvas\");\n  canvas.setAttribute(\"aria-hidden\", \"true\");\n  const caption = element(\"figcaption\");\n  const count = element(\"span\");\n  const description = element(\"span\");\n  caption.append(count, description);\n\n  const controls = element(\"div\", \"measure-scene-controls\");\n  controls.setAttribute(\"role\", \"group\");\n  controls.setAttribute(\"aria-label\", \"Animación educativa de \" + subject);\n  const play = button(\"\", togglePlayback);\n  const next = button(\"Siguiente\", advance);\n  const restart = button(\"Reiniciar\", replay);\n  controls.append(play, next, restart);\n\n  const progress = element(\"div\", \"measure-scene-progress\");\n  progress.setAttribute(\"aria-hidden\", \"true\");\n  const fill = element(\"i\");\n  progress.append(fill);\n  scene.append(canvas, caption, controls, progress);\n  card.querySelector(\"summary\").after(scene);\n\n  const draw = makeMeasurementArt(canvas, card.dataset.medida);\n  const total = captions.length * STEP_MS;\n  let time = 0;\n  let timer = 0;\n  let last = null;\n  let playing = !motion.matches;\n  let visible = false;\n  let shownStep = -1;\n\n  function render() {\n    const step = Math.min(captions.length - 1, Math.floor(time / STEP_MS));\n    if (step !== shownStep) {\n      count.textContent = (step + 1) + \" / \" + captions.length;\n      description.textContent = captions[step];\n      shownStep = step;\n    }\n    const phase = Math.min(.999, (time - step * STEP_MS) / STEP_MS);\n    draw(step, phase);\n    fill.style.transform = \"scaleX(\" + time / total + \")\";\n  }\n\n  function animate(now) {\n    timer = 0;\n    if (last !== null) time = Math.min(time + now - last, total);\n    last = now;\n    render();\n    if (time >= total) playing = false;\n    sync();\n  }\n\n  function sync() {\n    const shouldDraw = playing && card.open && visible && !document.hidden;\n    const action = playing ? \"Pausar\" : time >= total ? \"Repetir\" : \"Reproducir\";\n    if (play.textContent !== action) {\n      play.textContent = action;\n      play.setAttribute(\"aria-label\", action + \" animación de \" + subject);\n    }\n    if (shouldDraw) {\n      if (!timer) timer = requestAnimationFrame(animate);\n    } else {\n      cancelAnimationFrame(timer);\n      timer = 0;\n      last = null;\n    }\n  }\n\n  function togglePlayback() {\n    if (time >= total) time = 0;\n    playing = !playing;\n    render();\n    sync();\n  }\n\n  function advance() {\n    const step = Math.min(shownStep, captions.length - 1);\n    time = ((step + 1) % captions.length) * STEP_MS;\n    playing = false;\n    render();\n    sync();\n  }\n\n  function replay() {\n    time = 0;\n    last = null;\n    playing = !motion.matches;\n    render();\n    sync();\n  }\n\n  const inView = new IntersectionObserver(([entry]) => {\n    visible = entry.isIntersecting;\n    sync();\n  });\n  inView.observe(canvas);\n  new ResizeObserver(() => render()).observe(canvas);\n  document.addEventListener(\"visibilitychange\", sync);\n  motion.addEventListener(\"change\", () => {\n    if (motion.matches) playing = false;\n    sync();\n  });\n  card.addEventListener(\"toggle\", () => {\n    if (card.open) render();\n    sync();\n  });\n  render();\n  sync();\n}\n\nfor (const card of document.querySelectorAll(\"details[data-medida]\")) {\n  function mountWhenOpen() {\n    if (card.open) {\n      card.removeEventListener(\"toggle\", mountWhenOpen);\n      mountScene(card);\n    }\n  }\n  card.addEventListener(\"toggle\", mountWhenOpen);\n  mountWhenOpen();\n}\n\nreturn {  };\n})();\n})();"},"sintomas":{"title":"Guía de síntomas","styles":["styles.css","orbital.css","sintomas.css"],"html":"\u003c!doctype html>\n\u003chtml lang=\"es-CL\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#172e22\">\n  \u003cmeta name=\"description\" content=\"Guía visual de síntomas, posibles causas y señales de emergencia para la tripulación de una misión simulada.\">\n  \u003ctitle>Guía de síntomas · Vita-Cora\u003c/title>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip\" href=\"#contenido\">Saltar al contenido\u003c/a>\n\u003cdiv class=\"shell\">\n  \u003caside class=\"sidebar\">\n    \u003ca class=\"brand\" href=\"./\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"6\"/>\u003cellipse cx=\"12\" cy=\"12\" rx=\"11\" ry=\"4\" transform=\"rotate(-35 12 12)\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>Vita-Cora\u003c/strong>\u003csmall>NASA SPACE APPS 2026\u003c/small>\u003c/span>\u003c/a>\n    \u003cnav class=\"primary-nav\" aria-label=\"Secciones\">\n      \u003ca class=\"nav-link\" href=\"./\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/>\u003crect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/>\u003crect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>\u003crect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/>\u003c/svg>Panel general\u003c/a>\n      \u003ca class=\"nav-link\" href=\"guia.html\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 6c-2.7-2-5.8-2.5-10-1v14c4.2-1.5 7.3-1 10 1 2.7-1.5 5.8-2 10-1V5c-4.2-1.5-7.3-1-10 1Zm0 0v14\"/>\u003c/svg>Guía interactiva\u003c/a>\n      \u003ca class=\"nav-link selected\" href=\"sintomas.html\" aria-current=\"page\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 12h4l3-6 4 12 3-6h4\"/>\u003crect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"4\"/>\u003c/svg>Guía de síntomas\u003c/a>\n      \u003ca class=\"nav-link\" href=\"nutricion.html\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 3v6a3 3 0 0 0 6 0V3M6 3v18m13 0V3c-3 0-5 4-5 9h5\"/>\u003c/svg>Nutrición lunar\u003c/a>\n      \u003ca class=\"nav-link training-nav\" href=\"mision.html\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 21V3h14l-3 4 3 4H4M8 3v8m4-8v8\"/>\u003c/svg>Simulador de misión\u003c/a>\n      \u003ca class=\"nav-link\" href=\"./#historial\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003crect x=\"2\" y=\"2\" width=\"20\" height=\"20\" rx=\"3\"/>\u003cpath d=\"M8 6h10M8 12h10M8 18h10M5 6h.01M5 12h.01M5 18h.01\"/>\u003c/svg>Historial\u003c/a>\n      \u003ca class=\"nav-link\" href=\"./#resumenes\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M6 3h8l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z\"/>\u003cpath d=\"M14 3v5h4M8 12h6m-6 4h6\"/>\u003c/svg>Resúmenes\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"side-footer\">\u003cdiv class=\"profile\">\u003cspan class=\"profile-avatar\" aria-hidden=\"true\">A1\u003c/span>\u003cspan>\u003cstrong>Tripulante A-01\u003c/strong>\u003csmall>Perfil simulado\u003c/small>\u003c/span>\u003c/div>\u003c/div>\n  \u003c/aside>\n  \u003cdiv class=\"workspace\">\n    \u003cheader class=\"topbar\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>Salud de la tripulación\u003c/span>\u003cstrong>Guía de síntomas\u003c/strong>\u003c/div>\n      \u003cspan class=\"sim-label\">\u003ci>\u003c/i> Guía educativa\u003c/span>\n    \u003c/header>\n\n    \u003cmain class=\"main symptom-main\" id=\"contenido\">\n      \u003cheader class=\"symptom-header\">\n        \u003ch1>Guía de síntomas\u003c/h1>\n        \u003cp>Consulta qué puede explicar un síntoma, qué revisar en la bitácora y cuándo pedir ayuda a bordo. Un mismo síntoma puede tener varias causas. El equipo de salud confirma el diagnóstico.\u003c/p>\n      \u003c/header>\n\n      \u003csection class=\"symptom-urgent card\" aria-labelledby=\"sym-urgent-title\" id=\"aviso-inmediato\">\n        \u003csvg class=\"urgent-icon icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M10.3 4.5 2.6 18a1.5 1.5 0 0 0 1.3 2.2h16.2a1.5 1.5 0 0 0 1.3-2.2L13.7 4.5a2 2 0 0 0-3.4 0Z\"/>\u003cpath d=\"M12 9v4m0 3.5h.01\"/>\u003c/svg>\n        \u003cdiv>\n          \u003ch2 id=\"sym-urgent-title\">Pide ayuda de inmediato\u003c/h2>\n          \u003cp>Si hay dolor de pecho nuevo o intenso, falta de aire repentina, pérdida de conciencia, confusión repentina, pérdida súbita de visión, fuerza o habla, dolor de cabeza súbito e intenso, o sangrado que no se detiene, avisa a la tripulación y activa el protocolo de emergencia a bordo.\u003c/p>\n          \u003ca class=\"text-button\" href=\"mision.html#companero\">Practicar el aviso a bordo\u003c/a>\n        \u003c/div>\n      \u003c/section>\n\n      \u003cdiv class=\"symptom-layout\">\n        \u003csection class=\"symptom-browser card\" aria-labelledby=\"sym-search-title\">\n          \u003ch2 id=\"sym-search-title\">Busca un síntoma\u003c/h2>\n          \u003clabel class=\"sr-only\" for=\"sym-search\">Buscar por síntoma o factor\u003c/label>\n          \u003cinput class=\"field\" id=\"sym-search\" type=\"search\" placeholder=\"Ej. mareo, hierro, vitamina D\" autocomplete=\"off\">\n          \u003cdiv id=\"sym-filters\" class=\"symptom-filters\" role=\"group\" aria-label=\"Filtrar por grupo\">\u003c/div>\n          \u003cp id=\"sym-result-count\" class=\"symptom-muted\" role=\"status\">\u003c/p>\n          \u003cdiv id=\"sym-results\" class=\"symptom-results\" role=\"group\" aria-label=\"Síntomas disponibles\">\u003c/div>\n        \u003c/section>\n\n        \u003carticle class=\"symptom-detail card\" id=\"ficha-sintoma\" aria-labelledby=\"sym-title\">\n          \u003cheader class=\"symptom-detail-header\">\n            \u003cp id=\"sym-group\" class=\"symptom-group\">\u003c/p>\n            \u003ch2 id=\"sym-title\" tabindex=\"-1\">\u003c/h2>\n            \u003cp id=\"sym-description\">\u003c/p>\n          \u003c/header>\n          \u003cfigure class=\"symptom-scene\">\n            \u003cdiv id=\"sym-art\" aria-hidden=\"true\">\u003c/div>\n            \u003cfigcaption id=\"sym-figure-caption\">\u003c/figcaption>\n          \u003c/figure>\n          \u003cdiv class=\"symptom-detail-body\">\n            \u003csection aria-labelledby=\"sym-causes-title\">\n              \u003ch3 id=\"sym-causes-title\">Posibles explicaciones\u003c/h3>\n              \u003cul id=\"sym-causes\" class=\"symptom-factors\">\u003c/ul>\n            \u003c/section>\n            \u003csection class=\"symptom-observe\" aria-labelledby=\"sym-observe-title\">\n              \u003ch3 id=\"sym-observe-title\">Qué revisar o anotar\u003c/h3>\n              \u003cp id=\"sym-observe\">\u003c/p>\n            \u003c/section>\n            \u003csection class=\"symptom-help\" id=\"sym-help-box\" aria-labelledby=\"sym-help-title\">\n              \u003ch3 id=\"sym-help-title\">\u003c/h3>\n              \u003cp id=\"sym-help\">\u003c/p>\n            \u003c/section>\n            \u003csection aria-labelledby=\"sym-sources-title\">\n              \u003ch3 id=\"sym-sources-title\">Fuentes de esta ficha\u003c/h3>\n              \u003cul id=\"sym-sources\" class=\"symptom-sources\">\u003c/ul>\n            \u003c/section>\n          \u003c/div>\n        \u003c/article>\n        \u003cdiv id=\"sym-empty\" class=\"card symptom-empty\" hidden>\n          \u003ch2>Sin coincidencias\u003c/h2>\n          \u003cp>Prueba con otro síntoma o elige otro grupo.\u003c/p>\n        \u003c/div>\n      \u003c/div>\n\n      \u003csection class=\"card symptom-context\" aria-labelledby=\"sym-context-title\">\n        \u003cdiv class=\"symptom-context-head\">\n          \u003cdiv>\n            \u003ch2 id=\"sym-context-title\">Compara con tu bitácora\u003c/h2>\n            \u003cp>Consulta qué registraste el día del síntoma. Las coincidencias sirven para preparar la consulta con el equipo de salud.\u003c/p>\n          \u003c/div>\n          \u003clabel for=\"sym-date\">\u003cspan class=\"field-label\">Día de misión\u003c/span>\u003cselect id=\"sym-date\" class=\"field\">\u003c/select>\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"symptom-context-grid\">\n          \u003cdiv>\u003ch3>Sueño y fatiga\u003c/h3>\u003cp id=\"sym-sleep-data\">\u003c/p>\u003ca class=\"text-button\" href=\"./#descanso\">Abrir panel de descanso\u003c/a>\u003c/div>\n          \u003cdiv>\u003ch3>Alimentación y turno\u003c/h3>\u003cp id=\"sym-meal-data\">\u003c/p>\u003ca class=\"text-button\" href=\"nutricion.html#registro-comidas\">Abrir Nutrición lunar\u003c/a>\u003c/div>\n        \u003c/div>\n      \u003c/section>\n\n      \u003cfooter class=\"footer\">\u003cspan>Guía educativa para la misión simulada. Sigue el protocolo de tu misión ante síntomas reales.\u003c/span>\u003ca class=\"text-button\" href=\"guia.html\">Volver a la guía interactiva\u003c/a>\u003c/footer>\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","script":"(() => {\n\"use strict\";\nconst screen = window.vitaScreen;\nconst localStorage = parent.vitaOffline.storage;\nconst modules = Object.create(null);\nmodules[\"model.js\"] = (() => {\nconst MISSION_DATE = \"2026-11-14\";\nconst SLEEP_STORAGE_KEY = \"bitacora-orbital-v1\";\nconst MINUTES_PER_DAY = 1440;\nconst DAY_MS = 86_400_000;\nconst REFERENCE_NIGHTS = [465, 445, 450, 435, 460, 440, 455];\nconst BASELINE = Math.round(REFERENCE_NIGHTS.reduce((sum, value) => sum + value, 0) / REFERENCE_NIGHTS.length);\nconst REVIEW_THRESHOLD = 60;\n\nconst SLEEP_MINUTES = [450, 435, 462, 451, 442, 458, 445, 435, 470, 460, 443, 450, 375, 360];\nconst FATIGUE_LEVELS = [2, 2, 1, 2, 2, 1, 2, 2, 1, 1, 2, 2, 3, 4];\n\nconst SCENARIOS = {\n  trend: \"Dos noches bajo la referencia\",\n  stable: \"Historial estable\",\n  missing: \"Noche sin registro\"\n};\n\nfunction shiftDay(date, offset) {\n  return new Date(Date.parse(date) + offset * DAY_MS).toISOString().slice(0, 10);\n}\n\nfunction missionDay(date) {\n  return 43 + Math.round((Date.parse(date) - Date.parse(MISSION_DATE)) / DAY_MS);\n}\n\nfunction dateLabel(date, style = \"short\") {\n  return new Intl.DateTimeFormat(\"es-CL\", {\n    day: \"numeric\", month: \"short\", ...(style === \"full\" ? { year: \"numeric\" } : {}), timeZone: \"UTC\"\n  }).format(new Date(date)).replace(/\\./g, \"\");\n}\n\nfunction duration(minutes) {\n  const hours = Math.floor(minutes / 60);\n  const rest = minutes % 60;\n  return hours > 0 ? hours + \" h\" + (rest ? \" \" + rest + \" min\" : \"\") : rest + \" min\";\n}\n\nfunction difference(minutes) {\n  const offset = minutes - BASELINE;\n  if (offset === 0) return \"En la referencia\";\n  return (offset \u003c 0 ? \"−\" : \"+\") + duration(Math.abs(offset));\n}\n\nfunction isEntryDate(date) {\n  return /^\\d{4}-\\d{2}-\\d{2}$/.test(date) && date >= shiftDay(MISSION_DATE, -42) &&\n    date \u003c \"9999-12-31\" && Number.isFinite(Date.parse(date)) && shiftDay(date, 0) === date;\n}\n\nfunction validEntry(record) {\n  return record && isEntryDate(record.date) &&\n    Number.isInteger(record.minutes) && record.minutes >= 0 && record.minutes \u003c= MINUTES_PER_DAY &&\n    Number.isInteger(record.fatigue) && record.fatigue >= 1 && record.fatigue \u003c= 5;\n}\n\nfunction initialState() {\n  const data = Object.fromEntries(Object.keys(SCENARIOS).map(name => {\n    const normal = SLEEP_MINUTES.map((minutes, index) => ({\n      date: shiftDay(MISSION_DATE, index - (SLEEP_MINUTES.length - 1)),\n      minutes,\n      fatigue: FATIGUE_LEVELS[index]\n    }));\n    if (name !== \"trend\") {\n      Object.assign(normal.at(-2), { minutes: 444, fatigue: 2 });\n      Object.assign(normal.at(-1), { minutes: 455, fatigue: 2 });\n    }\n    if (name === \"missing\") normal.splice(normal.length - 2, 1);\n    return [name, { records: normal, reports: [] }];\n  }));\n  return { active: \"trend\", data };\n}\n\nfunction loadSleepState() {\n  const defaults = initialState();\n  try {\n    const saved = JSON.parse(localStorage.getItem(SLEEP_STORAGE_KEY));\n    if (!saved || !Object.hasOwn(SCENARIOS, saved.active)) return defaults;\n    defaults.active = saved.active;\n    for (const scenario of Object.keys(SCENARIOS)) {\n      const data = saved.data?.[scenario];\n      if (!data) continue;\n      if (Array.isArray(data.records)) defaults.data[scenario].records = data.records.filter(validEntry);\n      if (Array.isArray(data.reports)) defaults.data[scenario].reports = data.reports.filter(report =>\n        report && typeof report.title === \"string\" && typeof report.note === \"string\" &&\n        typeof report.description === \"string\" && isEntryDate(report.date) &&\n        Array.isArray(report.recent) && report.recent.every(record => record &&\n          isEntryDate(record.date) && (record.minutes === null || validEntry(record))));\n    }\n  } catch {\n    return defaults;\n  }\n  return defaults;\n}\n\nfunction endDate(records) {\n  return records.reduce((latest, record) => record.date > latest ? record.date : latest, MISSION_DATE);\n}\n\nfunction periodRows(records, count, end = endDate(records)) {\n  const byDay = new Map(records.map(record => [record.date, record]));\n  return Array.from({ length: count }, (_, index) => {\n    const date = shiftDay(end, index - count + 1);\n    return byDay.get(date) ?? { date, minutes: null, fatigue: null };\n  });\n}\n\nfunction evaluate(records) {\n  const recent = periodRows(records, 2);\n  const missing = recent.find(record => record.minutes === null);\n  if (missing) return { kind: \"missing\", recent, missing };\n  if (recent.every(record => record.minutes \u003c= BASELINE - REVIEW_THRESHOLD)) return { kind: \"trend\", recent };\n  return { kind: \"stable\", recent };\n}\n\nfunction sleepN n>\u003cstrong>Tripulante A-01\u003c/strong>\u003csmall>Perfil simulado\u003c/small>\u003c/span>\u003c/div>\u003c/div>\n  \u003c/aside>\n  \u003cdiv class=\"workspace\">\n    \u003cheader class=\"topbar\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>Salud de la tripulación\u003c/span>\u003csvg class=\"icon\">\u003cuse href=\"#n-arrow\"/>\u003c/svg>\u003cstrong>Nutrición lunar\u003c/strong>\u003c/div>\n      \u003cspan class=\"sim-label\">\u003ci>\u003c/i> Datos simulados\u003c/span>\n    \u003c/header>\n    \u003cmain class=\"main nutrition-main\" id=\"contenido\">\n      \u003csection class=\"nutrition-hero\" aria-labelledby=\"nutrition-title\">\n        \u003cdiv class=\"nutrition-intro\">\n          \u003ch1 id=\"nutrition-title\">Nutrición lunar\u003c/h1>\n          \u003cp>Registra cuánto comiste y descubre qué cambia durante los turnos largos.\u003c/p>\n          \u003cdiv class=\"nutrition-actions\">\n            \u003ca class=\"button primary\" href=\"#registro-comidas\">Registrar comida\u003c/a>\n            \u003ca class=\"button nutrition-outline\" href=\"#guia-nutrientes\">Guía de nutrientes\u003c/a>\n          \u003c/div>\n        \u003c/div>\n        \u003cfigure class=\"galley\">\n          \u003ccanvas id=\"galley-art\" role=\"img\" aria-label=\"Escena pixelada de un astronauta frente a una bandeja de comida y una ventana lunar.\">\u003c/canvas>\n          \u003cfigcaption>Módulo de alimentación \u003cbutton class=\"button quiet\" type=\"button\" id=\"galley-toggle\">Pausar\u003c/button>\u003c/figcaption>\n        \u003c/figure>\n      \u003c/section>\n\n      \u003csection class=\"card nutrition-week\" aria-labelledby=\"week-title\">\n        \u003cdiv class=\"card-heading\">\n          \u003cdiv>\u003ch2 id=\"week-title\">Semana de misión\u003c/h2>\u003cp>Elige un día para ver sus comidas y el contexto del turno.\u003c/p>\u003c/div>\n          \u003cspan id=\"week-range\" class=\"nutrition-range\">\u003c/span>\n        \u003c/div>\n        \u003cdiv id=\"nutrition-days\" class=\"nutrition-days\" role=\"group\" aria-label=\"Día de misión\">\u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"card nutrition-pattern\" aria-labelledby=\"pattern-title\">\n        \u003cdiv class=\"pattern-icon\" aria-hidden=\"true\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003cpath d=\"m3 7 6 6 4-4 7 7m-6 0h6v-6\"/>\u003c/svg>\u003c/div>\n        \u003cdiv>\n          \u003ch2 id=\"pattern-title\" aria-live=\"polite\">\u003c/h2>\n          \u003cp id=\"pattern-text\">\u003c/p>\n          \u003cp id=\"pattern-action\" hidden>Revisa las opciones de preparación rápida del menú simulado y comenta este patrón con el equipo de nutrición de la misión.\u003c/p>\n        \u003c/div>\n        \u003ca id=\"pattern-link\" class=\"button quiet\" href=\"#menu-rapido\" hidden>Ver opciones rápidas\u003c/a>\n      \u003c/section>\n\n      \u003cdiv class=\"nutrition-columns\">\n        \u003csection class=\"card nutrition-card\" id=\"registro-comidas\" aria-labelledby=\"meal-title\">\n          \u003cdiv class=\"card-heading\">\n            \u003cdiv>\u003ch2 id=\"meal-title\">Registro de comidas\u003c/h2>\u003cp id=\"meal-date\">\u003c/p>\u003c/div>\n            \u003cspan id=\"meal-count\" class=\"nutrition-range\">\u003c/span>\n          \u003c/div>\n          \u003cdiv id=\"meal-slots\" class=\"meal-slots\" role=\"group\" aria-label=\"Comida\">\u003c/div>\n          \u003cform id=\"meal-form\" class=\"meal-form\">\n            \u003cdiv>\n              \u003clabel class=\"field-label\" for=\"meal-status\">Estado de la comida\u003c/label>\n              \u003cselect class=\"field\" id=\"meal-status\">\n                \u003coption value=\"pending\">Pendiente de registrar\u003c/option>\n                \u003coption value=\"eaten\">Comí todo o parte\u003c/option>\n                \u003coption value=\"skipped\">Omití esta comida\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv id=\"food-fields\" class=\"meal-pair\" hidden>\n              \u003cdiv>\n                \u003clabel class=\"field-label\" for=\"meal-food\">Ración del menú espacial\u003c/label>\n                \u003cselect class=\"field\" id=\"meal-food\" aria-describedby=\"meal-preparation\" required>\u003c/select>\n              \u003c/div>\n              \u003cdiv>\n                \u003clabel class=\"field-label\" for=\"meal-portion\">Porción consumida\u003c/label>\n                \u003cselect class=\"field\" id=\"meal-portion\">\n                  \u003coption value=\"25\">¼ de la porción\u003c/option>\n                  \u003coption value=\"50\">½ de la porción\u003c/option>\n                  \u003coption value=\"75\">¾ de la porción\u003c/option>\n                  \u003coption value=\"100\">Porción completa\u003c/option>\n                \u003c/select>\n              \u003c/div>\n              \u003cp class=\"meal-preparation\" id=\"meal-preparation\" role=\"status\">\u003c/p>\n            \u003c/div>\n            \u003cdiv id=\"reason-field\" hidden>\n              \u003clabel class=\"field-label\" for=\"meal-reason\">¿Por qué comiste menos?\u003c/label>\n              \u003cselect class=\"field\" id=\"meal-reason\" required>\n                \u003coption value=\"\">Elige un motivo\u003c/option>\n                \u003coption value=\"tiempo\">Falta de tiempo\u003c/option>\n                \u003coption value=\"apetito\">Poco apetito\u003c/option>\n                \u003coption value=\"sabor\">Sabor\u003c/option>\n                \u003coption value=\"disponibilidad\">Alimento no disponible\u003c/option>\n                \u003coption value=\"otro\">Otro motivo\u003c/option>\n                \u003coption value=\"reservado\">Prefiero omitir el motivo\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv>\n              \u003clabel class=\"field-label\" for=\"meal-work\">Carga de trabajo del día\u003c/label>\n              \u003cselect class=\"field\" id=\"meal-work\">\n                \u003coption value=\"\">Sin registrar\u003c/option>\u003coption value=\"habitual\">Turno habitual\u003c/option>\u003coption value=\"largo\">Turno largo\u003c/option>\n              \u003c/select>\n            \u003c/div>\n            \u003cdiv class=\"meal-context\" id=\"meal-context\">\u003c/div>\n            \u003cdiv class=\"meal-submit\">\n              \u003cbutton class=\"button primary\" type=\"submit\">Guardar registro\u003c/button>\n              \u003cp id=\"meal-feedback\" class=\"entry-message\" role=\"status\">\u003c/p>\n            \u003c/div>\n          \u003c/form>\n        \u003c/section>\n\n        \u003csection class=\"card nutrition-card\" aria-labelledby=\"intake-title\">\n          \u003cdiv class=\"card-heading\">\n            \u003cdiv>\u003ch2 id=\"intake-title\">Aporte estimado\u003c/h2>\u003cp id=\"intake-caption\">\u003c/p>\u003c/div>\n          \u003c/div>\n          \u003cdiv id=\"intake-metrics\" class=\"intake-metrics\" role=\"group\" aria-label=\"Indicador para el gráfico\">\u003c/div>\n          \u003cdiv class=\"intake-chart\">\n            \u003cdiv class=\"intake-chart-title\">\u003ch3 id=\"intake-chart-title\">Tendencia de siete días\u003c/h3>\u003cspan id=\"intake-goal\">\u003c/span>\u003c/div>\n            \u003cdiv id=\"intake-bars\" class=\"intake-bars\" role=\"list\" aria-label=\"Aporte estimado de los últimos siete días de la simulación\">\u003c/div>\n            \u003cp class=\"intake-key\">\u003cspan>\u003ci>\u003c/i> Registro completo\u003c/span>\u003cspan>\u003ci>\u003c/i> Registro parcial\u003c/span>\u003cspan>— Sin registros\u003c/span>\u003c/p>\n          \u003c/div>\n          \u003cp class=\"nutrition-note\">Los alimentos y las metas pertenecen al perfil simulado. Una ingesta estimada sirve para revisar hábitos. Para confirmar una deficiencia se requiere evaluación clínica.\u003c/p>\n        \u003c/section>\n      \u003c/div>\n\n      \u003csection class=\"card nutrition-card\" id=\"menu-rapido\" aria-labelledby=\"quick-menu-title\">\n        \u003cdiv class=\"card-heading\">\u003cdiv>\u003ch2 id=\"quick-menu-title\">Opciones de preparación rápida\u003c/h2>\u003cp>Ejemplos del menú simulado para revisar con el equipo de nutrición.\u003c/p>\u003c/div>\u003c/div>\n        \u003cul id=\"quick-foods\" class=\"quick-foods\">\u003c/ul>\n        \u003cp class=\"nutrition-note\">\u003ca class=\"text-button\" href=\"https://www.nasa.gov/wp-content/uploads/2023/12/ochmo-tb-013-food-and-nutrition.pdf\" target=\"_blank\" rel=\"noopener\">NASA · Alimentos y envases para vuelos espaciales\u003c/a>\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"card nutrition-card nutrient-guide\" id=\"guia-nutrientes\" aria-labelledby=\"nutrient-guide-title\">\n        \u003cdiv class=\"card-heading\">\u003cdiv>\n          \u003ch2 id=\"nutrient-guide-title\">Guía de vitaminas y minerales\u003c/h2>\n          \u003cp>Valores diarios de referencia para adultos de 31 a 50 años. Cuando difieren, aparecen en orden mujeres / hombres. La vitamina D usa la referencia de NASA para vuelo espacial.\u003c/p>\n        \u003c/div>\u003c/div>\n        \u003cp class=\"nutrition-note\">\u003ca class=\"text-button\" href=\"sintomas.html#calambres\">Consultar síntomas y factores nutricionales\u003c/a>\u003c/p>\n        \u003cdiv class=\"nutrient-controls\">\n          \u003cdiv class=\"nutrient-filters\" role=\"group\" aria-label=\"Tipo de nutriente\">\n            \u003cbutton class=\"button quiet\" type=\"button\" data-filter=\"all\" aria-pressed=\"true\">Todos\u003c/button>\n            \u003cbutton class=\"button quiet\" type=\"button\" data-filter=\"vitamina\" aria-pressed=\"false\">Vitaminas\u003c/button>\n            \u003cbutton class=\"button quiet\" type=\"button\" data-filter=\"mineral\" aria-pressed=\"false\">Minerales\u003c/button>\n          \u003c/div>\n          \u003clabel class=\"nutrient-search\">\u003cspan class=\"field-label\">Buscar nutriente\u003c/span>\u003cinput class=\"field\" type=\"search\" id=\"nutrient-search\" placeholder=\"Ej. hierro\">\u003c/label>\n        \u003c/div>\n        \u003cp id=\"nutrient-count\" class=\"nutrition-note\" role=\"status\">\u003c/p>\n        \u003cdiv id=\"nutrient-grid\" class=\"nutrient-grid\">\u003c/div>\n        \u003cp class=\"nutrition-note\">RAE significa equivalentes de actividad de retinol, NE significa equivalentes de niacina y DFE significa equivalentes dietarios de folato.\u003c/p>\n        \u003cul class=\"nutrition-sources\">\n          \u003cli>\u003ca class=\"text-button\" href=\"https://standards.nasa.gov/system/files/tmp/NASA-STD-3001%20Vol%202%20Rev%20F.pdf#page=117\" target=\"_blank\" rel=\"noopener\">NASA-STD-3001 · Tabla 7.1-2\u003c/a>\u003c/li>\n          \u003cli>\u003ca class=\"text-button\" href=\"https://www.nasa.gov/missions/station/faq-the-real-story-about-astronaut-health-care-in-space/\" target=\"_blank\" rel=\"noopener\">NASA · Salud de la tripulación en el espacio\u003c/a>\u003c/li>\n          \u003cli>\u003ca class=\"text-button\" href=\"https://www.nasa.gov/wp-content/uploads/2024/08/human-adaptation-2021-final-b.pdf\" target=\"_blank\" rel=\"noopener\">NASA · Nutrición y adaptación al vuelo espacial\u003c/a>\u003c/li>\n          \u003cli>\u003ca class=\"text-button\" href=\"https://www.canada.ca/en/health-canada/services/food-nutrition/healthy-eating/dietary-reference-intakes/tables/reference-values-vitamins.html\" target=\"_blank\" rel=\"noopener\">Health Canada · Vitaminas\u003c/a>\u003c/li>\n          \u003cli>\u003ca class=\"text-button\" href=\"https://www.canada.ca/en/health-canada/services/food-nutrition/healthy-eating/dietary-reference-intakes/tables/reference-values-elements.html\" target=\"_blank\" rel=\"noopener\">Health Canada · Minerales\u003c/a>\u003c/li>\n        \u003c/ul>\n      \u003c/section>\n\n      \u003cfooter class=\"footer\">\u003cspan>Prototipo educativo. Los registros de comidas se guardan en este navegador.\u003c/span>\u003ca class=\"text-button\" href=\"guia.html\">Volver a la guía interactiva\u003c/a>\u003c/footer>\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","script":"(() => {\n\"use strict\";\nconst screen = window.vitaScreen;\nconst localStorage = parent.vitaOffline.storage;\nconst modules = Object.create(null);\nmodules[\"model.js\"] = (() => {\nconst MISSION_DATE = \"2026-11-14\";\nconst SLEEP_STORAGE_KEY = \"bitacora-orbital-v1\";\nconst MINUTES_PER_DAY = 1440;\nconst DAY_MS = 86_400_000;\nconst REFERENCE_NIGHTS = [465, 445, 450, 435, 460, 440, 455];\nconst BASELINE = Math.round(REFERENCE_NIGHTS.reduce((sum, value) => sum + value, 0) / REFERENCE_NIGHTS.length);\nconst REVIEW_THRESHOLD = 60;\n\nconst SLEEP_MINUTES = [450, 435, 462, 451, 442, 458, 445, 435, 470, 460, 443, 450, 375, 360];\nconst FATIGUE_LEVELS = [2, 2, 1, 2, 2, 1, 2, 2, 1, 1, 2, 2, 3, 4];\n\nconst SCENARIOS = {\n  trend: \"Dos noches bajo la referencia\",\n  stable: \"Historial estable\",\n  missing: \"Noche sin registro\"\n};\n\nfunction shiftDay(date, offset) {\n  return new Date(Date.parse(date) + offset * DAY_MS).toISOString().slice(0, 10);\n}\n\nfunction missionDay(date) {\n  return 43 + Math.round((Date.parse(date) - Date.parse(MISSION_DATE)) / DAY_MS);\n}\n\nfunction dateLabel(date, style = \"short\") {\n  return new Intl.DateTimeFormat(\"es-CL\", {\n    day: \"numeric\", month: \"short\", ...(style === \"full\" ? { year: \"numeric\" } : {}), timeZone: \"UTC\"\n  }).format(new Date(date)).replace(/\\./g, \"\");\n}\n\nfunction duration(minutes) {\n  const hours = Math.floor(minutes / 60);\n  const rest = minutes % 60;\n  return hours > 0 ? hours + \" h\" + (rest ? \" \" + rest + \" min\" : \"\") : rest + \" min\";\n}\n\nfunction difference(minutes) {\n  const offset = minutes - BASELINE;\n  if (offset === 0) return \"En la referencia\";\n  return (offset \u003c 0 ? \"−\" : \"+\") + duration(Math.abs(offset));\n}\n\nfunction isEntryDate(date) {\n  return /^\\d{4}-\\d{2}-\\d{2}$/.test(date) && date >= shiftDay(MISSION_DATE, -42) &&\n    date \u003c \"9999-12-31\" && Number.isFinite(Date.parse(date)) && shiftDay(date, 0) === date;\n}\n\nfunction validEntry(record) {\n  return record && isEntryDate(record.date) &&\n    Number.isInteger(record.minutes) && record.minutes >= 0 && record.minutes \u003c= MINUTES_PER_DAY &&\n    Number.isInteger(record.fatigue) && record.fatigue >= 1 && record.fatigue \u003c= 5;\n}\n\nfunction initialState() {\n  const data = Object.fromEntries(Object.keys(SCENARIOS).map(name => {\n    const normal = SLEEP_MINUTES.map((minutes, index) => ({\n      date: shiftDay(MISSION_DATE, index - (SLEEP_MINUTES.length - 1)),\n      minutes,\n      fatigue: FATIGUE_LEVELS[index]\n    }));\n    if (name !== \"trend\") {\n      Object.assign(normal.at(-2), { minutes: 444, fatigue: 2 });\n      Object.assign(normal.at(-1), { minutes: 455, fatigue: 2 });\n    }\n    if (name === \"missing\") normal.splice(normal.length - 2, 1);\n    return [name, { records: normal, reports: [] }];\n  }));\n  return { active: \"trend\", data };\n}\n\nfunction loadSleepState() {\n  const defaults = initialState();\n  try {\n    const saved = JSON.parse(localStorage.getItem(SLEEP_STORAGE_KEY));\n    if (!saved || !Object.hasOwn(SCENARIOS, saved.active)) return defaults;\n    defaults.active = saved.active;\n    for (const scenario of Object.keys(SCENARIOS)) {\n      const data = saved.data?.[scenario];\n      if (!data) continue;\n      if (Array.isArray(data.records)) defaults.data[scenario].records = data.records.filter(validEntry);\n      if (Array.isArray(data.reports)) defaults.data[scenario].reports = data.reports.filter(report =>\n        report && typeof report.title === \"string\" && typeof report.note === \"string\" &&\n        typeof report.description === \"string\" && isEntryDate(report.date) &&\n        Array.isArray(report.recent) && report.recent.every(record => record &&\n          isEntryDate(record.date) && (record.minutes === null || validEntry(record))));\n    }\n  } catch {\n    return defaults;\n  }\n  return defaults;\n}\n\nfunction endDate(records) {\n  return records.reduce((latest, record) => record.date > latest ? record.date : latest, MISSION_DATE);\n}\n\nfunction periodRows(records, count, end = endDate(records)) {\n  const byDay = new Map(records.map(record => [record.date, record]));\n  return Array.from({ length: count }, (_, index) => {\n    const date = shiftDay(end, index - count + 1);\n    return byDay.get(date) ?? { date, minutes: null, fatigue: null };\n  });\n}\n\nfunction evaluate(records) {\n  const recent = periodRows(records, 2);\n  const missing = recent.find(record => record.minutes === null);\n  if (missing) return { kind: \"missing\", recent, missing };\n  if (recent.every(record => record.minutes \u003c= BASELINE - REVIEW_THRESHOLD)) return { kind: \"trend\", recent };\n  return { kind: \"stable\", recent };\n}\n\nfunction sleepNote(status) {\n  const [first, last] = status.recent;\n  if (status.kind === \"trend\") {\n    return 'El ' + dateLabel(first.date) + ' dormiste ' + duration(first.minutes) + ' y el ' +\n      dateLabel(last.date) + ', ' + duration(last.minutes) + '. Ambas noches quedaron al menos ' +\n      duration(REVIEW_THRESHOLD) + ' bajo tu referencia de ' + duration(BASELINE) + '.';\n  }\n  if (status.kind === \"missing\") {\n    return 'Falta el registro del ' + dateLabel(status.missing.date) + '. Completa esa noche para evaluar la tendencia de los últimos dos días.';\n  }\n  return 'Las dos noches más recientes no activan el aviso de descenso respecto a tu referencia personal.';\n}\n\nreturn { MISSION_DATE, SLEEP_STORAGE_KEY, BASELINE, REVIEW_THRESHOLD, SCENARIOS, shiftDay, missionDay, dateLabel, duration, difference, isEntryDate, validEntry, initialState, loadSleepState, endDate, periodRows, evaluate, sleepNote };\n})();\nmodules[\"nutricion-datos.js\"] = (() => {\nconst { MISSION_DATE, shiftDay } = modules[\"model.js\"];\n t previous = new Option(FOODS[meal.food].name + \" (menú anterior)\", meal.food);\n    previous.dataset.previousFood = \"\";\n    foodSelect.add(previous);\n  }\n  foodSelect.value = meal?.food ?? \"\";\n  get(\"meal-portion\").value = meal?.portion ?? \"100\";\n  get(\"meal-reason\").value = meal?.reason ?? \"\";\n  get(\"meal-work\").value = day.work;\n  const sleep = sleepRecords.get(selectedDay);\n  const context = get(\"meal-context\");\n  context.replaceChildren(node(\"strong\", \"Sueño y fatiga del panel\"));\n  context.append(node(\"p\", sleep ? \"Sueño: \" + duration(sleep.minutes) + \" · Fatiga \" + fatigueLabels[sleep.fatigue] + \" (\" + sleep.fatigue + \"/5)\" : \"Sin registro de sueño y fatiga para este día.\"));\n  get(\"meal-feedback\").textContent = \"\";\n  updateMealFields();\n}\n\nfunction updateMealFields() {\n  const status = get(\"meal-status\").value;\n  const eaten = status === \"eaten\";\n  const needsReason = status === \"skipped\" || (eaten && Number(get(\"meal-portion\").value) \u003c 100);\n  get(\"food-fields\").hidden = !eaten;\n  foodSelect.disabled = !eaten;\n  get(\"meal-portion\").disabled = !eaten;\n  get(\"reason-field\").hidden = !needsReason;\n  get(\"meal-reason\").disabled = !needsReason;\n  get(\"reason-field\").firstElementChild.textContent = status === \"skipped\" ? \"¿Por qué omitiste la comida?\" : \"¿Por qué comiste menos?\";\n  renderPreparation();\n}\n\nfunction renderPreparation() {\n  const food = FOODS[foodSelect.value];\n  get(\"meal-preparation\").textContent = food\n    ? FOOD_TYPES[food.type]?.description ?? \"Alimento del menú anterior.\"\n    : \"Elige una ración para ver cómo se conserva y prepara.\";\n}\n\nfunction renderPattern() {\n  const matches = findTimePattern(days);\n  const show = matches.length >= 3;\n  const showIntake = matches.filter(day => {\n    const { count, totals } = estimate(day);\n    return count === 3 && totals.energia \u003c METRICS.energia.goal && totals.magnesio \u003c METRICS.magnesio.goal;\n  }).length;\n  get(\"pattern-title\").textContent = show ? \"Se repitió la falta de tiempo\" : \"Patrón de almuerzos\";\n  const skipped = matches.some(day => day.meals.almuerzo.status === \"skipped\");\n  let description = \"La demo muestra un aviso si coinciden tres turnos largos con almuerzos de menos de media porción u omitidos por falta de tiempo.\";\n  if (show) {\n    const behavior = skipped ? \"omitiste el almuerzo o comiste menos de la mitad\" : \"comiste menos de la mitad del almuerzo\";\n    description = \"En \" + matches.length + \" turnos largos \" + behavior + \" y marcaste «falta de tiempo».\";\n    if (showIntake > 0) description += \" En \" + (showIntake === 1 ? \"1 día con registro completo\" : showIntake + \" días con registro completo\") + \" el aporte estimado de energía y magnesio quedó bajo la meta simulada.\";\n  } else if (matches.length > 0) {\n    description += \" Coincidencias en esta semana: \" + matches.length + \" de 3.\";\n  }\n  get(\"pattern-text\").textContent = description;\n  get(\"pattern-action\").hidden = !show;\n  get(\"pattern-link\").hidden = !show;\n  get(\"pattern-title\").closest(\"section\").classList.toggle(\"found\", show);\n}\n\nfunction renderIntake() {\n  const metric = METRICS[selectedMetric];\n  const { count, totals: selectedTotals } = estimate(days[selectedDay]);\n  get(\"intake-caption\").textContent = count === 3 ? \"Día \" + missionDay(selectedDay) + \" · Registro completo\" :\n    count > 0 ? \"Día \" + missionDay(selectedDay) + \" · Suma parcial de las comidas registradas\" : \"Día \" + missionDay(selectedDay) + \" · Sin registro de comidas\";\n  get(\"intake-goal\").textContent = \"Meta: \" + format(metric.goal, metric);\n  for (const button of get(\"intake-metrics\").children) {\n    const item = METRICS[button.value];\n    const value = selectedTotals[button.value];\n    button.lastElementChild.textContent = count ? format(value, item) : \"—\";\n    button.setAttribute(\"aria-pressed\", button.value === selectedMetric);\n  }\n\n  const estimates = DAYS.map(date => ({ date, ...estimate(days[date]) }));\n  const maximum = Math.max(metric.goal * 1.12, ...estimates.map(day => day.totals[selectedMetric]));\n  const bars = get(\"intake-bars\");\n  bars.style.setProperty(\"--goal-height\", metric.goal / maximum);\n  bars.replaceChildren(...estimates.map(({ date, count: entries, totals }) => {\n    const value = totals[selectedMetric];\n    const column = node(\"div\", null, \"intake-column\");\n    column.setAttribute(\"role\", \"listitem\");\n    column.setAttribute(\"aria-label\", \"Día \" + missionDay(date) + \": \" + (entries ? format(value, metric) + (entries === 3 ? \", completo\" : \", parcial\") : \"sin registros\"));\n    column.title = column.getAttribute(\"aria-label\");\n    column.classList.toggle(\"current\", date === selectedDay);\n    const track = node(\"div\", null, \"intake-track\");\n    const bar = node(\"div\", entries ? \"\" : \"—\", \"intake-bar\");\n    bar.classList.toggle(\"partial\", entries > 0 && entries \u003c 3);\n    bar.classList.toggle(\"empty\", entries === 0);\n    bar.style.setProperty(\"--bar-height\", (100 * value / maximum) + \"%\");\n    track.append(bar);\n    column.append(track, node(\"span\", String(missionDay(date)), \"intake-day\"));\n    return column;\n  }));\n}\n\nfunction normalized(value) {\n  return value.normalize(\"NFD\").replace(/\\p{Diacritic}/gu, \"\").toLowerCase().trim();\n}\n\nfunction sourceLink(label, url) {\n  const link = node(\"a\", label, \"text-button\");\n  link.href = url;\n  link.target = \"_blank\";\n  link.rel = \"noopener\";\n  return link;\n}\n\nfunction renderNutrients() {\n  const query = normalized(get(\"nutrient-search\").value);\n  const entries = NUTRIENTS.filter(([type, name]) =>\n    (selectedFilter === \"all\" || type === selectedFilter) && normalized(type + \" \" + name).includes(query)\n  );\n  get(\"nutrient-count\").textContent = entries.length\n    ? entries.length + (entries.length === 1 ? \" ficha\" : \" fichas\")\n    : \"Sin resultados. Prueba otro nombre o cambia el filtro.\";\n  get(\"nutrient-grid\").replaceChildren(...entries.map(([type, name, value, effect, source, standard]) => {\n    const details = node(\"details\", null, \"nutrient-item\");\n    const summary = node(\"summary\");\n    summary.append(node(\"small\", type === \"vitamina\" ? \"Vitamina\" : \"Mineral\"), node(\"strong\", name), node(\"span\", value, \"nutrient-value\"));\n    const copy = node(\"div\", null, \"nutrient-copy\");\n    copy.append(node(\"strong\", \"Qué puede ocurrir si hay deficiencia\"), node(\"p\", effect), sourceLink(\"Fuente sobre este nutriente\", source));\n    if (standard) copy.append(sourceLink(\"Referencia de NASA para vuelo espacial\", standard));\n    details.append(summary, copy);\n    return details;\n  }));\n}\n\nfunction renderDay() {\n  renderSelections();\n  renderForm();\n  renderIntake();\n}\n\nget(\"week-range\").textContent = dateLabel(DAYS[0]) + \" – \" + dateLabel(DAYS.at(-1));\nfor (const date of DAYS) {\n  selectionButton(get(\"nutrition-days\"), date, \"Día \" + missionDay(date), \"0/3 comidas\", value => {\n    selectedDay = value;\n    renderDay();\n  });\n}\nfor (const [key, label] of Object.entries(MEALS)) {\n  selectionButton(get(\"meal-slots\"), key, label, \"Pendiente\", value => {\n    selectedMeal = value;\n    renderSelections();\n    renderForm();\n  });\n}\nfor (const [key, metric] of Object.entries(METRICS)) {\n  selectionButton(get(\"intake-metrics\"), key, metric.name, \"—\", value => {\n    selectedMetric = value;\n    renderIntake();\n  });\n}\nfoodSelect.add(new Option(\"Elige una ración\", \"\"));\nfor (const [type, category] of Object.entries(FOOD_TYPES)) {\n  const group = node(\"optgroup\");\n  group.label = category.name;\n  for (const [key, food] of Object.entries(SPACE_MENU)) {\n    if (food.type === type) group.append(new Option(food.name, key));\n  }\n  foodSelect.append(group);\n}\nfoodSelect.addEventListener(\"change\", renderPreparation);\n\nfor (const food of Object.values(SPACE_MENU).filter(food => food.quick)) {\n  const item = node(\"li\");\n  item.append(\n    node(\"strong\", food.name),\n    node(\"p\", FOOD_TYPES[food.type].description),\n    node(\"p\", Object.entries(METRICS).map(([metric, units]) =>\n      format(food.values[metric], units) + \" de \" + units.name.slice(0, 1).toLowerCase() + units.name.slice(1)\n    ).join(\" · \") + \" por porción simulada.\")\n  );\n  get(\"quick-foods\").append(item);\n}\nfor (const id of [\"meal-status\", \"meal-portion\"]) get(id).addEventListener(\"change\", updateMealFields);\n\nget(\"meal-form\").addEventListener(\"submit\", event => {\n  event.preventDefault();\n  const day = days[selectedDay];\n  const status = get(\"meal-status\").value;\n  const reason = get(\"meal-reason\").disabled ? \"\" : get(\"meal-reason\").value;\n  day.work = get(\"meal-work\").value;\n  if (status === \"pending\") delete day.meals[selectedMeal];\n  if (status === \"skipped\") day.meals[selectedMeal] = { status, reason };\n  if (status === \"eaten\") day.meals[selectedMeal] = { status, reason, food: get(\"meal-food\").value, portion: Number(get(\"meal-portion\").value) };\n  let message = \"Registro guardado en este navegador.\";\n  try {\n    localStorage.setItem(NUTRITION_STORAGE_KEY, JSON.stringify(days));\n  } catch {\n    message = \"Registro actualizado durante esta sesión. El navegador no permitió guardarlo.\";\n  }\n  renderDay();\n  renderPattern();\n  get(\"meal-feedback\").textContent = message;\n});\n\nfor (const button of document.querySelectorAll(\"[data-filter]\")) {\n  button.addEventListener(\"click\", () => {\n    selectedFilter = button.dataset.filter;\n    for (const filter of document.querySelectorAll(\"[data-filter]\")) {\n      filter.setAttribute(\"aria-pressed\", filter === button);\n    }\n    renderNutrients();\n  });\n}\nget(\"nutrient-search\").addEventListener(\"input\", renderNutrients);\n\nrenderDay();\nrenderPattern();\nrenderNutrients();\nstartGalley(get(\"galley-art\"), get(\"galley-toggle\"));\n\nreturn {  };\n})();\n})();"},"mision":{"title":"Simulador de misión","styles":["styles.css","orbital.css"],"html":"\u003c!doctype html>\n\u003chtml lang=\"es-CL\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#172e22\">\n  \u003cmeta name=\"description\" content=\"Simulador de entrenamiento para practicar cómo pedir ayuda en una misión espacial.\">\n  \u003ctitle>Simulador de misión · Vita-Cora\u003c/title>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip\" href=\"#contenido\">Saltar al contenido\u003c/a>\n\u003cdiv class=\"shell\">\n  \u003caside class=\"sidebar\">\n    \u003ca class=\"brand\" href=\"./\">\u003cspan class=\"brand-mark\" aria-hidden=\"true\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"6\"/>\u003cellipse cx=\"12\" cy=\"12\" rx=\"11\" ry=\"4\" transform=\"rotate(-35 12 12)\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>Vita-Cora\u003c/strong>\u003csmall>NASA SPACE APPS 2026\u003c/small>\u003c/span>\u003c/a>\n    \u003cnav class=\"primary-nav\" aria-label=\"Secciones\">\n      \u003ca class=\"nav-link\" href=\"./\">\u003cspan class=\"menu-pixel\" aria-hidden=\"true\">▦\u003c/span>Panel general\u003c/a>\n      \u003ca class=\"nav-link\" href=\"guia.html\">\u003cspan class=\"menu-pixel\" aria-hidden=\"true\">▤\u003c/span>Guía interactiva\u003c/a>\n      \u003ca class=\"nav-link\" href=\"sintomas.html\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 12h4l3-6 4 12 3-6h4\"/>\u003crect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"4\"/>\u003c/svg>Guía de síntomas\u003c/a>\n      \u003ca class=\"nav-link\" href=\"nutricion.html\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 3v6a3 3 0 0 0 6 0V v class=\"stage-context\">\u003cspan id=\"stage-indicator\">○\u003c/span>\u003cstrong id=\"stage-label\">Elige tu rol\u003c/strong>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"connection\">\u003clabel>\u003cinput id=\"disconnect\" type=\"checkbox\"> Simular pérdida del enlace con Tierra\u003c/label>\u003cbutton class=\"button quiet\" id=\"pause-game\" type=\"button\">Pausar animación\u003c/button>\u003c/div>\n        \u003c/section>\n        \u003csection class=\"card game-console\" aria-labelledby=\"step-title\">\n          \u003col class=\"game-progress\" aria-label=\"Progreso del ejercicio\">\n            \u003cli aria-current=\"step\">\u003cspan>01\u003c/span>Situación\u003c/li>\n            \u003cli>\u003cspan>02\u003c/span>Aviso\u003c/li>\n            \u003cli>\u003cspan>03\u003c/span>Registro\u003c/li>\n            \u003cli>\u003cspan>04\u003c/span>Informe\u003c/li>\n          \u003c/ol>\n          \u003cdiv class=\"step-live\" aria-live=\"polite\">\n            \u003ch2 id=\"step-title\" tabindex=\"-1\">\u003c/h2>\n            \u003cp id=\"step-copy\">\u003c/p>\n          \u003c/div>\n          \u003cdiv id=\"step-controls\">\u003c/div>\n          \u003cdiv class=\"game-tools\" id=\"game-tools\">\u003cbutton type=\"button\" class=\"text-button\" id=\"game-back\">Paso anterior\u003c/button>\u003cbutton type=\"button\" class=\"text-button\" id=\"game-restart\">Reiniciar práctica\u003c/button>\u003c/div>\n        \u003c/section>\n      \u003c/div>\n      \u003cdiv class=\"card saved-case\" id=\"saved-case\" hidden>\n        \u003cdiv>\u003ch2>Último informe de práctica\u003c/h2>\u003cp id=\"saved-status\">\u003c/p>\u003c/div>\n        \u003cdiv>\u003cbutton type=\"button\" class=\"button quiet\" id=\"download-case\">Descargar informe\u003c/button>\u003cbutton type=\"button\" class=\"button quiet\" id=\"deliver-case\" hidden>Simular envío a Tierra\u003c/button>\u003c/div>\n      \u003c/div>\n      \u003cfooter class=\"footer\">\u003cspan>Simulación educativa. En una misión real, sigue el protocolo a bordo.\u003c/span>\u003ca class=\"text-button\" href=\"https://www.nasa.gov/centers-and-facilities/ames/ames-science/ames-space-biosciences/a-clinical-decision-support-system-for-earth-independent-medical-operations/\" target=\"_blank\" rel=\"noopener\">NASA · Atención médica sin apoyo inmediato de Tierra ↗\u003c/a>\u003c/footer>\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\u003ctemplate id=\"choose-role\">\n  \u003cdiv class=\"choice-stack\">\n    \u003cbutton class=\"game-choice\" data-action=\"self\" type=\"button\">\u003cspan aria-hidden=\"true\">▣\u003c/span>\u003cspan>\u003cstrong>Me cuesta respirar\u003c/strong>\u003csmall>Reporto lo que me pasa.\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">›\u003c/span>\u003c/button>\n    \u003cbutton class=\"game-choice\" data-action=\"crew\" type=\"button\">\u003cspan aria-hidden=\"true\">✚\u003c/span>\u003cspan>\u003cstrong>Ayudo a un compañero\u003c/strong>\u003csmall>Le cuesta respirar o parece que no responde.\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">›\u003c/span>\u003c/button>\n  \u003c/div>\n\u003c/template>\n\u003ctemplate id=\"check-response\">\n  \u003cdiv class=\"choice-stack\">\n    \u003cbutton class=\"game-choice\" data-action=\"responds\" type=\"button\">\u003cspan aria-hidden=\"true\">▸\u003c/span>\u003cspan>\u003cstrong>Sí, responde\u003c/strong>\u003csmall>Voy a pedir ayuda médica a bordo.\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">›\u003c/span>\u003c/button>\n    \u003cbutton class=\"game-choice urgent\" data-action=\"unresponsive\" type=\"button\">\u003cspan aria-hidden=\"true\">!\u003c/span>\u003cspan>\u003cstrong>No responde o no estoy seguro\u003c/strong>\u003csmall>Activo la respuesta de emergencia a bordo.\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">›\u003c/span>\u003c/button>\n  \u003c/div>\n\u003c/template>\n\u003ctemplate id=\"call-crew\">\n  \u003cp class=\"game-quote\" data-role=\"callout\">\u003c/p>\n  \u003cp class=\"small-copy\">Durante este ejercicio, la llamada se representa con el botón.\u003c/p>\n  \u003cbutton type=\"button\" class=\"button primary main-move\" data-action=\"call\">Simular aviso a bordo\u003c/button>\n\u003c/template>\n\u003ctemplate id=\"collect-data\">\n  \u003cform id=\"case-data\">\n    \u003cdiv class=\"split-fields\">\u003clabel class=\"field-label\">Módulo\u003cselect class=\"field\" name=\"location\">\u003coption>Módulo de trabajo\u003c/option>\u003coption>Módulo de descanso\u003c/option>\u003coption>Módulo médico\u003c/option>\u003c/select>\u003c/label>\n    \u003clabel class=\"field-label\">¿Cuándo empezó?\u003cselect class=\"field\" name=\"onset\">\u003coption>Hace un momento\u003c/option>\u003coption>Hace unos minutos\u003c/option>\u003coption>No se sabe\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n    \u003clabel class=\"field-label\">Oxímetro de dedo (opcional)\u003cselect class=\"field\" name=\"reading\">\u003coption>No medida\u003c/option>\u003coption>Lectura simulada: 96 %\u003c/option>\u003coption>No hubo una lectura estable\u003c/option>\u003c/select>\u003c/label>\n    \u003cp class=\"small-copy\">Si el responsable a bordo solicita una lectura, puedes registrarla. Primero va el aviso.\u003c/p>\n    \u003cbutton type=\"submit\" class=\"button primary main-move\">Revisar informe\u003c/button>\n  \u003c/form>\n\u003c/template>\n\u003ctemplate id=\"review-case\">\n  \u003cdl class=\"report-grid\" data-role=\"report\">\u003c/dl>\n  \u003cbutton type=\"button\" class=\"button primary main-move\" data-action=\"save\">Guardar informe y completar\u003c/button>\n\u003c/template>\n\u003ctemplate id=\"mission-complete\">\n  \u003cdiv class=\"mission-award\">\u003cspan aria-hidden=\"true\">★\u003c/span>\u003cdiv>\u003cstrong>Práctica completada\u003c/strong>\u003cp>Pediste ayuda a bordo y dejaste un informe de lo ocurrido.\u003c/p>\u003c/div>\u003c/div>\n  \u003cbutton type=\"button\" class=\"button primary main-move\" data-action=\"restart\">Volver a practicar\u003c/button>\n\u003c/template>\n\u003c/body>\n\u003c/html>\n","script":"(() => {\n\"use strict\";\nconst screen = window.vitaScreen;\nconst localStorage = parent.vitaOffline.storage;\nconst modules = Object.create(null);\nmodules[\"mision.js\"] = (() => {\nconst $ = id => document.getElementById(id);\nconst main = $(\"contenido\");\nconst controls = $(\"step-controls\");\nconst disconnect = $(\"disconnect\");\nconst storageKey = \"bitacora-orbital-case-v1\";\nconst motion = window.matchMedia(\"(prefers-reduced-motion: reduce)\");\nconst progress = [...document.querySelectorAll(\".game-progress li\")];\nconst locationNames = [\"Módulo de trabajo\", \"Módulo de descanso\", \"Módulo médico\"];\nconst timeOptions = [\"Hace un momento\", \"Hace unos minutos\", \"No se sabe\"];\nconst readingOptions = [\"No medida\", \"Lectura simulada: 96 %\", \"No hubo una lectura estable\"];\n\nconst steps = {\n  role: { title: \"¿Qué ocurre?\", copy: \"Elige cómo vas a participar en el ejercicio.\", visual: \"Elige tu rol\", symbol: \"○\", index: 0, template: \"choose-role\" },\n  response: { title: \"¿Te responde cuando le hablas?\", copy: \"Elige lo que observas para practicar el aviso a bordo.\", visual: \"Revisa si responde\", symbol: \"?\", index: 0, template: \"check-response\" },\n  call: { title: \"Pide ayuda a bordo\", copy: \"Avisa por el canal de la tripulación. Puedes hacerlo aunque se pierda el enlace con Tierra.\", visual: \"Canal de tripulación\", symbol: \"◉\", index: 1, template: \"call-crew\" },\n  record: { title: \"Anota lo que ocurrió\", copy: \"Con el aviso hecho, deja los datos básicos para la revisión médica.\", visual: \"Registra el caso\", symbol: \"▤\", index: 2, template: \"collect-data\" },\n  review: { title: \"Revisa el informe\", copy: \"El informe reúne lo que observaste y lo que hiciste. Puedes guardarlo a bordo.\", visual: \"Informe listo para revisar\", symbol: \"▣\", index: 3, template: \"review-case\" },\n  done: { title: \"Ejercicio terminado\", copy: \"Ya puedes consultar el informe de esta práctica.\", visual: \"Práctica completada\", symbol: \"★\", index: 4, template: \"mission-complete\" }\n};\nconst labels = {\n  self: \"Me cuesta respirar\",\n  responds: \"Compañero con dificultad para respirar. Responde al hablarle.\",\n  unresponsive: \"El compañero no responde o no se pudo confirmar que responde.\"\n};\nconst savedStates = {\n  onboard: \"Guardado a bordo · Listo para simular el envío\",\n  pending: \"Guardado a bordo · Pendiente de envío\",\n  delivered: \"Envío a Tierra simulado\"\n};\nlet scenario = newScenario();\nlet stored = loadReport();\nlet view = \"role\";\nlet paused = motion.matches;\n\nfunction newScenario() {\n  return { role: null, situation: null, location: locationNames[0], onset: timeOptions[0], reading: readingOptions[0] };\n}\n\nfunction loadReport() {\n  try {\n    const report = JSON.parse(localStorage.getItem(storageKey));\n    if (report && Object.hasOwn(labels, report.situation) && Object.hasOwn(savedStates, report.status) &&\n        locationNames.includes(report.location) && timeOptions.includes(report.onset) &&\n        readingOptions.includes(report.reading)) return report;\n  } catch { /* The exercise is still available for this session. */ }\n  return null;\n}\n\nfunction saveReport(report) {\n  stored = report;\n  try {\n    localStorage.setItem(storageKey, JSON.stringify(report));\n  } catch {\n    renderSaved(\"Solo disponible durante esta sesión\");\n    return;\n  }\n  renderSaved();\n}\n\nfunction shownStatus(report) {\n  return disconnect.checked && report.status !== \"delivered\" ? savedStates.pending : savedStates[report.status];\n}\n\nfunction reportFields(report) {\n  const alert = report.situation === \"unresponsive\" ? \"Activación de emergencia simulada\" : \"Aviso a tripulación simulado\";\n  return [\n    [\"Situación\", labels[report.situation]], [\"Módulo\", report.location], [\"Inicio\", report.onset],\n    [\"Oxímetro\", report.reading], [\"Acción\", alert]\n  ];\n}\n\nfunction renderSaved(note) {\n  const area = $(\"saved-case\");\n  area.hidden = !stored;\n  if (!stored) return;\n  $(\"saved-status\").textContent = shownStatus(stored) + (note ? \" · \" + note : \"\");\n  $(\"deliver-case\").hidden = disconnect.checked || stored.status === \"delivered\";\n}\n\nfunction renderLink() {\n  const label = $(\"link-label\");\n  label.textContent = disconnect.checked ? \"TIERRA · SIN ENLACE\" : \"TIERRA · CON ENLACE\";\n  label.classList.toggle(\"no-link\", disconnect.checked);\n  renderSaved();\n}\n\nfunction renderMotion() {\n  main.classList.toggle(\"paused\", paused);\n  $(\"pause-game\").textContent = paused ? \"Reproducir animación\" : \"Pausar animación\";\n}\n\nfunction fillReport() {\n  const list = controls.querySelector('[data-role=\"report\"]');\n  for (const [heading, value] of reportFields(scenario)) {\n    const term = document.createElement(\"dt\");\n    term.textContent = heading;\n    const description = document.createElement(\"dd\");\n    description.textContent = value;\n    list.append(term, description);\n  }\n}\n\nfunction show(destination, focus = true) {\n  view = destination;\n  const lesson = steps[destination];\n  const title = $(\"step-title\");\n  const urgent = destination === \"call\" && scenario.situation === \"unresponsive\";\n  title.textContent = urgent ? \"Activa la respuesta de emergencia a bordo\" : lesson.title;\n  $(\"step-copy\").textContent = lesson.copy;\n  $(\"stage-label\").textContent = urgent ? \"Emergencia a bordo\" : lesson.visual;\n  $(\"stage-indicator\").textContent = urgent ? \"!\" : lesson.symbol;\n  main.dataset.scene = destination;\n  main.classList.toggle(\"urgent-stage\", urgent);\n  for (const [index, point] of progress.entries()) {\n    point.classList.toggle(\"done\", index \u003c lesson.index);\n    if (index === lesson.index) point.setAttribute(\"aria-current\", \"step\");\n    else point.removeAttribute(\"aria-current\");\n  }\n  controls.replaceChildren($(lesson.template).content.cloneNode(true));\n  $(\"game-tools\").hidden = destination === \"done\";\n  $(\"game-back\").hidden = destination === \"role\";\n  if (destination === \"call\") {\n    controls.querySelector('[data-role=\"callout\"]').textContent = urgent ?\n      \"«Emergencia médica en [tu módulo]. Un compañero no responde».\" :\n      \"«Necesito ayuda médica en [tu módulo]. Hay dificultad para respirar».\";\n  } else if (destination === \"record\") {\n    const form = $(\"case-data\");\n    for (const name of [\"location\", \"onset\", \"reading\"]) form.elements.namedItem(name).value = scenario[name];\n  } else if (destination === \"review\") {\n    fillReport();\n  }\n  if (focus) title.focus();\n}\n\nfunction restart() {\n  scenario = newScenario();\n  show(\"role\");\n}\n\nconst actions = {\n  self() { scenario.role = \"self\"; scenario.situation = \"self\"; show(\"call\"); },\n  crew() { scenario.role = \"crew\"; scenario.situation = null; show(\"response\"); },\n  responds() { scenario.situation = \"responds\"; show(\"call\"); },\n  unresponsive() { scenario.situation = \"unresponsive\"; show(\"call\"); },\n  call() { show(\"record\"); },\n  save() {\n    saveReport({ ...scenario, status: disconnect.checked ? \"pending\" : \"onboard\" });\n    show(\"done\");\n  },\n  restart\n};\n\ncontrols.addEventListener(\"click\", event => {\n  const button = event.target.closest(\"button[data-action]\");\n  if (button) actions[button.dataset.action]();\n});\n\nfunction captureForm(form) {\n  const values = new FormData(form);\n  for (const name of [\"location\", \"onset\", \"reading\"]) scenario[name] = values.get(name);\n}\n\ncontrols.addEventListener(\"submit\", event => {\n  event.preventDefault();\n  captureForm(event.target);\n  show(\"review\");\n});\n\n$(\"game-back\").addEventListener(\"click\", () => {\n  const back = { response: \"role\", call: scenario.role === \"crew\" ? \"response\" :   <script>(() => {
  "use strict";
  const resources = JSON.parse(document.getElementById("vita-bundle").textContent);
  const memory = new Map();
  let file = document.getElementById("vita-frame");
  const storage = {
    getItem(key) {
      try {
        return memory.has(key) ? memory.get(key) : window.localStorage.getItem(key);
      } catch {
        return memory.get(key) ?? null;
      }
    },
    setItem(key, value) {
      memory.set(key, value);
      window.localStorage.setItem(key, value);
      memory.delete(key);
    }
  };
  const byFilename = {
    "./": "inicio",
    "index.html": "inicio",
    "guia.html": "guia",
    "sintomas.html": "sintomas",
    "nutricion.html": "nutricion",
    "mision.html": "mision"
  };
  let current;

  function fromHash() {
    const [page, target = ""] = location.hash.slice(1).split("/");
    return Object.hasOwn(resources.pages, page) ? { page, target } : { page: "inicio", target: "" };
  }

  function key(route) {
    return "#" + route.page + (route.target ? "/" + encodeURIComponent(route.target) : "");
  }

  function resolve(href, page) {
    if (!href) return null;
    const [path, target = ""] = href.split("#", 2);
    if (!path && href.startsWith("#")) return { page, target };
    if (!Object.hasOwn(byFilename, path)) return null;
    return { page: byFilename[path], target };
  }

  function scrollToTarget(frameWindow, target, focus) {
    if (!target) {
      frameWindow.scrollTo(0, 0);
      return;
    }
    const anchor = frameWindow.document.getElementById(target);
    if (!anchor) return;
    anchor.scrollIntoView();
    if (focus && anchor.tagName === "MAIN") {
      anchor.tabIndex = -1;
      anchor.focus({ preventScroll: true });
    }
  }

  function createScreen(page, target) {
    let hash = target ? "#" + target : "";
    let frameWindow;
    return {
      get hash() { return hash; },
      go(nextHash, silent = false) {
        navigate({ page, target: nextHash.replace(/^#/, "") }, { silent });
      },
      bind(nextWindow) {
        frameWindow = nextWindow;
      },
      activate(next, { backward = false, silent = false } = {}) {
        hash = next ? "#" + next : "";
        if (!silent && frameWindow) {
          frameWindow.dispatchEvent(new frameWindow.HashChangeEvent("hashchange"));
          if (backward) frameWindow.dispatchEvent(new frameWindow.PopStateEvent("popstate"));
          scrollToTarget(frameWindow, next, next === "contenido");
        }
      }
    };
  }

  let screen;
  function mount(route, options = {}) {
    const samePage = current?.page === route.page;
    current = route;
    if (samePage) {
      screen.activate(route.target, options);
      return;
    }

    const lesson = resources.pages[route.page];
    screen = createScreen(route.page, route.target);
    document.title = lesson.title + " · Vita-Cora sin conexión";
    const css = lesson.styles.map(name => resources.styles[name]).join("\n");
    const headEnd = "<" + "/head>";
    const bodyEnd = "<" + "/body>";
    const scriptStart = "<" + "script>";
    const scriptEnd = "<" + "/script>";
    const boot = scriptStart + "window.vitaScreen = parent.vitaOffline.bind(window, " +
      JSON.stringify(route.page) + ");" + scriptEnd;
    const html = lesson.html
      .replace(headEnd, () => "<style>" + css + "</style>" + headEnd)
      .replace(bodyEnd, () => boot + scriptStart + lesson.script + scriptEnd + bodyEnd);
    const frame = document.createElement("iframe");
    frame.id = file.id;
    frame.title = lesson.title;
    frame.srcdoc = html;
    file.replaceWith(frame);
    file = frame;
  }

  function navigate(route, options = {}) {
    const address = key(route);
    if (address !== location.hash) history.pushState(null, "", address);
    mount(route, options);
  }

  window.vitaOffline = {
    storage,
    download(text, filename) {
      const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    },
    bind(frameWindow, page) {
      const bound = screen;
      bound.bind(frameWindow);
      frameWindow.document.addEventListener("click", event => {
        const link = event.target.closest?.("a[href]");
        if (event.defaultPrevented || !link || link.hasAttribute("download")) return;
        const href = link.getAttribute("href");
        const route = resolve(href, page);
        if (!route) return;
        event.preventDefault();
        if (event.ctrlKey || event.metaKey || event.shiftKey) {

          window.open(destination.href, "_blank", "noopener");

        }

      }, { once: true });

    }
  };
  const restore = () => {

    if (key(route) !== key(current)) mount(route, { backward: true });
