">\u003csvg class=\"icon\">\u003cuse href=\"#i-list\"/>\u003c/svg>\u003cspan>Historial\u003c/span>\u003c/a>\n      \u003ca class=\"nav-link\" href=\"#resumenes\">\u003csvg class=\"icon\">\u003cuse href=\"#i-doc\"/>\u003c/svg>\u003cspan>Resúmenes\u003c/span>\u003c/a>\n    \u003c/nav>\n    \u003cdiv class=\"side-footer\">\n      \u003cbutton class=\"nav-link about-open\" type=\"button\">\u003csvg class=\"icon\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cspan>Acerca de la demo\u003c/span>\u003c/button>\n      \u003cdiv class=\"profile\">\n        \u003cspan class=\"profile-avatar\" aria-hidden=\"true\">A1\u003c/span>\n        \u003cspan>\u003cstrong>Tripulante A-01\u003c/strong>\u003csmall>Perfil simulado\u003c/small>\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/aside>\n  \u003cdiv class=\"workspace\">\n    \u003cheader class=\"topbar\" id=\"panel\">\n      \u003cdiv class=\"breadcrumb\">\u003cspan>Salud de la tripulación\u003c/span>\u003csvg class=\"icon\">\u003cuse href=\"#i-chevron\"/>\u003c/svg>\u003cstrong>Panel general\u003c/strong>\u003c/div>\n      \u003cdiv class=\"top-actions\">\n        \u003cspan class=\"sim-label\">\u003ci>\u003c/i> Datos simulados\u003c/span>\n        \u003cbutton id=\"open-scenarios\" class=\"button quiet\" type=\"button\">\u003csvg class=\"icon\">\u003cuse href=\"#i-play\"/>\u003c/svg>Escenarios\u003c/button>\n      \u003c/div>\n    \u003c/header>\n    \u003cmain id=\"contenido\" class=\"main\">\n      \u003csection class=\"mission-hero\" aria-labelledby=\"page-title\">\n        \u003cdiv class=\"hero-content\">\n          \u003cdiv class=\"mission\">\u003cspan class=\"pixel-light\" aria-hidden=\"true\">\u003c/span> MISIÓN SIMULADA \u003cspan>·\u003c/span> \u003cspan id=\"mission-day\">DÍA 043\u003c/span>\u003c/div>\n          \u003ch1 id=\"page-title\" aria-label=\"Vita-Cora\">Vita-\u003cbr>Cora\u003c/h1>\n          \u003cp>Monitorea tu salud y practica cómo responder a bordo.\u003c/p>\n          \u003ca class=\"button primary hero-action\" href=\"mision.html\">\u003csvg class=\"icon\">\u003cuse href=\"#i-play\"/>\u003c/svg> Iniciar simulación\u003c/a>\n        \u003c/div>\n        \u003cdiv class=\"hero-scene\" aria-hidden=\"true\">\u003cspan class=\"scene-label\">MÓDULO MÉDICO \u003csmall>· ARTE CON IA\u003c/small>\u003c/span>\u003cspan class=\"scene-signal\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/span>\u003c/div>\n      \u003c/section>\n      \u003cnav class=\"quick-actions\" aria-label=\"Accesos rápidos\">\n        \u003ca href=\"#descanso\">\u003cspan class=\"quick-icon\">\u003csvg class=\"icon\">\u003cuse href=\"#i-moon\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>Sueño y fatiga\u003c/strong>\u003csmall>Consulta tu descanso\u003c/small>\u003c/span>\u003csvg class=\"icon quick-arrow\">\u003cuse href=\"#i-chevron\"/>\u003c/svg>\u003c/a>\n        \u003ca href=\"guia.html\">\u003cspan class=\"quick-icon\">\u003csvg class=\"icon\">\u003cuse href=\"#i-book\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>Guías animadas\u003c/strong>\u003csmall>Autocuidado y apoyo a la tripulación\u003c/small>\u003c/span>\u003csvg class=\"icon quick-arrow\">\u003cuse href=\"#i-chevron\"/>\u003c/svg>\u003c/a>\n        \u003ca href=\"mision.html\">\u003cspan class=\"quick-icon\">\u003csvg class=\"icon\">\u003cuse href=\"#i-flag\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>Simulador de misión\u003c/strong>\u003csmall>Practica cómo pedir ayuda\u003c/small>\u003c/span>\u003csvg class=\"icon quick-arrow\">\u003cuse href=\"#i-chevron\"/>\u003c/svg>\u003c/a>\n        \u003ca href=\"nutricion.html\">\u003cspan class=\"quick-icon\">\u003csvg class=\"icon\">\u003cuse href=\"#i-food\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>Nutrición lunar\u003c/strong>\u003csmall>Registra las comidas a bordo\u003c/small>\u003c/span>\u003csvg class=\"icon quick-arrow\">\u003cuse href=\"#i-chevron\"/>\u003c/svg>\u003c/a>\n      \u003c/nav>\n      \u003cdiv class=\"section-line\" id=\"descanso\">\u003ch2>Sueño y fatiga\u003c/h2>\u003cspan>TRIPULANTE A-01\u003c/span>\u003ca class=\"text-button\" href=\"sintomas.html#fatiga\">Explorar síntomas\u003c/a>\u003c/div>\n      \u003csection class=\"stats\" aria-label=\"Indicadores de descanso\">\n        \u003carticle class=\"stat card\">\n          \u003cdiv class=\"stat-heading\">\u003cspan>Última noche registrada\u003c/span>\u003cdiv class=\"stat-icon blue\">\u003csvg class=\"icon\">\u003cuse href=\"#i-moon\"/>\u003c/svg>\u003c/div>\u003c/div>\n          \u003cp class=\"stat-value\" id=\"last-sleep\">6 h\u003c/p>\u003cp class=\"stat-detail\" id=\"last-detail\">\u003c/p>\n        \u003c/article>\n        \u003carticle class=\"stat card\">\n          \u003cdiv class=\"stat-heading\">\u003cspan>Referencia personal\u003c/span>\u003cdiv class=\"stat-icon violet\">\u003csvg class=\"icon\">\u003cuse href=\"#i-target\"/>\u003c/svg>\u003c/div>\u003c/div>\n          \u003cp class=\"stat-value\" id=\"baseline\">7 h 30 min\u003c/p>\u003cp class=\"stat-detail\">Promedio de 7 noches previas a la misión\u003c/p>\n        \u003c/article>\n        \u003carticle class=\"stat card\">\n          \u003cdiv class=\"stat-heading\">\u003cspan>Fatiga percibida\u003c/span>\u003cdiv class=\"stat-icon amber\">\u003csvg class=\"icon\">\u003cuse href=\"#i-zap\"/>\u003c/svg>\u003c/div>\u003c/div>\n          \u003cp class=\"stat-value\" id=\"last-fatigue\">4 \u003cspan>/ 5\u003c/span>\u003c/p>\u003cp class=\"stat-detail\" id=\"fatigue-detail\">\u003c/p>\n        \u003c/article>\n      \u003c/section>\n      \u003cdiv class=\"dashboard-grid\">\n        \u003csection class=\"card chart-card\" aria-labelledby=\"chart-title\">\n          \u003cdiv class=\"card-heading chart-heading\">\n            \u003cdiv>\u003ch2 id=\"chart-title\">Tendencia de sueño\u003c/h2>\u003cp>Horas registradas por noche\u003c/p>\u003c/div>\n            \u003cdiv class=\"segmented\" role=\"group\" aria-label=\"Período del gráfico\">\n              \u003cbutton class=\"period active\" data-days=\"7\" type=\"button\" aria-pressed=\"true\">7 días\u003c/button>\n              \u003cbutton class=\"period\" data-days=\"14\" type=\"button\" aria-pressed=\"false\">14 días\u003c/button>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"plot\">\n            \u003ccanvas id=\"sleep-chart\" tabindex=\"0\" aria-label=\"Gráfico de sueño por noche. Usa las flechas izquierda y derecha para consultar valores. Los mismos datos están en el historial.\">\u003c/canvas>\n            \u003cdiv id=\"point-detail\" class=\"point-detail\" hidden>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"legend-line\">\u003c/i> Sueño registrado\u003c/span>\u003cspan>\u003ci class=\"legend-baseline\">\u003c/i> Referencia personal\u003c/span>\u003cspan id=\"missing-legend\" hidden>\u003ci class=\"legend-missing\">\u003c/i> Sin registro\u003c/span>\u003c/div>\n          \u003cspan id=\"chart-reading\" class=\"sr-only\" role=\"status\">\u003c/span>\n        \u003c/section>\n        \u003csection class=\"card entry-card\" aria-labelledby=\"entry-title\">\n          \u003cdiv class=\"card-heading\">\u003cdiv>\u003ch2 id=\"entry-title\">Registro diario\u003c/h2>\u003cp>Ingresa los datos de una noche.\u003c/p>\u003c/div>\u003cdiv class=\"stat-icon blue\">\u003csvg class=\"icon\">\u003cuse href=\"#i-plus\"/>\u003c/svg>\u003c/div>\u003c/div>\n          \u003cform id=\"entry-form\">\n            \u003clabel class=\"field-label\" for=\"entry-date\">Fecha del registro\u003c/label>\n            \u003cinput class=\"field\" id=\"entry-date\" name=\"date\" type=\"date\" required>\n            \u003cfieldset class=\"sleep-fields\">\n              \u003clegend class=\"field-label\">Duración del sueño\u003c/legend>\n              \u003cdiv class=\"split-fields\">\n                \u003clabel class=\"number-field\">\u003cspan class=\"sr-only\">Horas\u003c/span>\u003cinput id=\"entry-hours\" name=\"hours\" type=\"number\" min=\"0\" max=\"24\" step=\"1\" placeholder=\"0\" required>\u003cspan aria-hidden=\"true\">h\u003c/span>\u003c/label>\n                \u003clabel class=\"number-field\">\u003cspan class=\"sr-only\">Minutos\u003c/span>\u003cinput id=\"entry-minutes\" name=\"minutes\" type=\"number\" min=\"0\" max=\"59\" step=\"1\" placeholder=\"0\">\u003cspan aria-hidden=\"true\">min\u003c/span>\u003c/label>\n              \u003c/div>\n            \u003c/fieldset>\n            \u003cfieldset class=\"fatigue-fields\">\n              \u003clegend class=\"field-label\">Fatiga percibida\u003c/legend>\n              \u003cdiv class=\"fatigue-scale\">\n                \u003clabel>\u003cinput name=\"fatigue\" type=\"radio\" value=\"1\" required>\u003cspan>1\u003c/span>\u003c/label>\n                \u003clabel>\u003cinput name=\"fatigue\" type=\"radio\" value=\"2\">\u003cspan>2\u003c/span>\u003c/label>\n                \u003clabel>\u003cinput name=\"fatigue\" type=\"radio\" value=\"3\">\u003cspan>3\u003c/span>\u003c/label>\n                \u003clabel>\u003cinput name=\"fatigue\" type=\"radio\" value=\"4\">\u003cspan>4\u003c/span>\u003c/label>\n                \u003clabel>\u003cinput name=\"fatigue\" type=\"radio\" value=\"5\">\u003cspan>5\u003c/span>\u003c/label>\n              \u003c/div>\n              \u003cdiv class=\"scale-labels\">\u003cspan>Muy baja\u003c/span>\u003cspan>Muy alta\u003c/span>\u003c/div>\n            \u003c/fieldset>\n            \u003cbutton class=\"button primary\" type=\"submit\">\u003csvg class=\"icon\">\u003cuse href=\"#i-check\"/>\u003c/svg>\u003cspan id=\"entry-submit\">Guardar registro\u003c/span>\u003c/button>\n            \u003cp id=\"entry-message\" class=\"entry-message\" role=\"status\" hidden>\u003c/p>\n          \u003c/form>\n        \u003c/section>\n      \u003c/div>\n      \u003csection id=\"trend-banner\" class=\"trend-banner card\" aria-live=\"polite\">\n        \u003cdiv class=\"trend-mark\">\u003csvg class=\"icon\">\u003cuse id=\"trend-icon\" href=\"#i-alert\"/>\u003c/svg>\u003c/div>\n        \u003cdiv class=\"trend-copy\">\u003ch2 id=\"trend-title\">Revisar tendencia\u003c/h2>\u003cp id=\"trend-message\">\u003c/p>\u003c/div>\n        \u003cbutton class=\"button outline\" id=\"open-summary\" type=\"button\">Preparar resumen \u003csvg class=\"icon\">\u003cuse href=\"#i-arrow\"/>\u003c/svg>\u003c/button>\n      \u003c/section>\n      \u003csection class=\"card history-card\" id=\"historial\" aria-labelledby=\"history-title\">\n        \u003cdiv class=\"card-heading\">\u003cdiv>\u003ch2 id=\"history-title\">Historial de sueño\u003c/h2>\u003cp id=\"history-caption\">Registros de la misión simulada\u003c/p>\u003c/div>\u003c/div>\n        \u003cdiv class=\"table-scroll\">\n          \u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Fecha\u003c/th>\u003cth scope=\"col\">Sueño\u003c/th>\u003cth scope=\"col\">Fatiga\u003c/th>\u003cth scope=\"col\">Respecto a la referencia\u003c/th>\u003cth scope=\"col\">\u003cspan class=\"sr-only\">Acciones\u003c/span>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"history-body\">\u003c/tbody>\u003c/table>\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"card summary-card\" id=\"resumenes\" aria-labelledby=\"summary-title\">\n        \u003cdiv class=\"card-heading\">\u003cdiv>\u003ch2 id=\"summary-title\">Resúmenes para revisión\u003c/h2>\u003cp>Registros guardados en este navegador.\u003c/p>\u003c/div>\u003c/div>\n        \u003cdiv id=\"summary-list\">\u003c/div>\n      \u003c/section>\n      \u003cfooter class=\"footer\">\u003cspan>Prototipo de NASA Space Apps 2026 · Datos de demostración\u003c/span>\u003cbutton type=\"button\" class=\"about-open text-button\">Método y fuentes \u003csvg class=\"icon\">\u003cuse href=\"#i-arrow-ext\"/>\u003c/svg>\u003c/button>\u003c/footer>\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\u003cdialog id=\"scenarios-dialog\" aria-labelledby=\"scenarios-title\">\n  \u003cdiv class=\"dialog-heading\">\u003cdiv>\u003ch2 id=\"scenarios-title\">Escenarios de la demo\u003c/h2>\u003cp>Cada escenario conserva sus propios registros y resúmenes.\u003c/p>\u003c/div>\u003cbutton class=\"icon-button close-dialog\" type=\"button\" aria-label=\"Cerrar\">\u003csvg class=\"icon\">\u003cuse href=\"#i-close\"/>\u003c/svg>\u003c/button>\u003c/div>\n  \u003cdiv class=\"scenario-list\">\n    \u003cbutton class=\"scenario\" data-scenario=\"trend\" type=\"button\">\u003cspan class=\"scenario-mark amber\">\u003csvg class=\"icon\">\u003cuse href=\"#i-alert\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>Dos noches bajo la referencia\u003c/strong>\u003csmall>El aviso explica el cambio y permite documentarlo.\u003c/small>\u003c/span>\u003cspan class=\"scenario-current\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"scenario\" data-scenario=\"stable\" type=\"button\">\u003cspan class=\"scenario-mark blue\">\u003csvg class=\"icon\">\u003cuse href=\"#i-check\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>Historial estable\u003c/strong>\u003csmall>Registros cercanos a la referencia personal.\u003c/small>\u003c/span>\u003cspan class=\"scenario-current\">\u003c/span>\u003c/button>\n    \u003cbutton class=\"scenario\" data-scenario=\"missing\" type=\"button\">\u003cspan class=\"scenario-mark violet\">\u003csvg class=\"icon\">\u003cuse href=\"#i-calendar\"/>\u003c/svg>\u003c/span>\u003cspan>\u003cstrong>Noche sin registro\u003c/strong>\u003csmall>El gráfico muestra una brecha y el panel pide completar el dato.\u003c/small>\u003c/span>\u003cspan class=\"scenario-current\">\u003c/span>\u003c/button>\n  \u003c/div>\n\u003c/dialog>\n\u003cdialog id=\"summary-dialog\" aria-labelledby=\"draft-title\">\n  \u003cdiv class=\"dialog-heading\">\u003cdiv>\u003ch2 id=\"draft-title\">Preparar resumen\u003c/h2>\u003cp>Agrega el contexto que podría ayudar al equipo de salud a revisar los registros.\u003c/p>\u003c/div>\u003cbutton class=\"icon-button close-dialog\" type=\"button\" aria-label=\"Cerrar\">\u003csvg class=\"icon\">\u003cuse href=\"#i-close\"/>\u003c/svg>\u003c/button>\u003c/div>\n  \u003cp class=\"draft-context\" id=\"draft-context\">\u003c/p>\n  \u003cform id=\"summary-form\">\u003clabel class=\"field-label\" for=\"summary-note\">Nota para revisión\u003c/label>\u003ctextarea class=\"field\" id=\"summary-note\" name=\"note\" placeholder=\"Ej. Hubo un cambio de turno esta semana.\" maxlength=\"500\" rows=\"3\">\u003c/textarea>\u003cdiv class=\"dialog-actions\">\u003cbutton class=\"button quiet close-dialog\" type=\"button\">Cancelar\u003c/button>\u003cbutton class=\"button primary\" type=\"submit\">Guardar resumen\u003c/button>\u003c/div>\u003c/form>\n\u003c/dialog>\n\u003cdialog id=\"about-dialog\" aria-labelledby=\"about-title\">\n  \u003cdiv class=\"dialog-heading\">\u003cdiv>\u003ch2 id=\"about-title\">Método y fuentes\u003c/h2>\u003cp>Vita-Cora · NASA Space Apps 2026\u003c/p>\u003c/div>\u003cbutton class=\"icon-button close-dialog\" type=\"button\" aria-label=\"Cerrar\">\u003csvg class=\"icon\">\u003cuse href=\"#i-close\"/>\u003c/svg>\u003c/button>\u003c/div>\n  \u003cp>La referencia personal corresponde al promedio de siete noches simuladas previas a la misión. El aviso se activa si las dos noches más recientes y consecutivas quedan al menos una hora por debajo de esa referencia. Es una regla de demostración para revisar registros. El Programa de Investigación Humana de NASA estudia el sueño insuficiente y los horarios irregulares por su impacto en el desempeño de la tripulación.\u003c/p>\n  \u003cp>Las mediciones y el perfil son ficticios. La app guarda los datos en este navegador. Las fuentes y videos externos requieren conexión. Puedes descargar los resúmenes sin conexión.\u003c/p>\n  \u003cul class=\"source-list\">\n    \u003cli>\u003ca href=\"https://www.nasa.gov/hrp/risks/\" target=\"_blank\" rel=\"noopener\">NASA · Riesgos del vuelo espacial\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"https://www.nasa.gov/reference/risk-from-inadequate-sleep-and-irregular-schedules/\" target=\"_blank\" rel=\"noopener\">NASA · Sueño insuficiente y horarios irregulares\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"https://www.nasa.gov/humans-in-space/spaceflight-standard-measures-characterizing-how-humans-adapt-in-space/\" target=\"_blank\" rel=\"noopener\">NASA · Spaceflight Standard Measures\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"https://eol.jsc.nasa.gov/SearchPhotos/photo.pl?frame=198176&amp;mission=ISS067&amp;roll=E\" target=\"_blank\" rel=\"noopener\">NASA · Fotografía ISS067-E-198176\u003c/a>\u003c/li>\n    \u003cli>\u003ca href=\"https://www.spaceappschallenge.org/2026/challenges/health-monitoring-software/\" target=\"_blank\" rel=\"noopener\">NASA Space Apps · Desafío oficial\u003c/a>\u003c/li>\n  \u003c/ul>\n\u003c/dialog>\n\u003c/body>\n\u003c/html>\n","script":"(() => {\n\"use strict\";\nconst screen = window.vitaScreen;\nconst localStorage = parent.vitaOffline.storage;\nconst modules = Object.create(null);\nmodules[\"model.js\"] = (() => {\nconst MISSION_DATE = \"2026-11-14\";\nconst SLEEP_STORAGE_KEY = \"bitacora-orbital-v1\";\nconst MINUTES_PER_DAY = 1440;\nconst DAY_MS = 86_400_000;\nconst REFERENCE_NIGHTS = [465, 445, 450, 435, 460, 440, 455];\nconst BASELINE = Math.round(REFERENCE_NIGHTS.reduce((sum, value) => sum + value, 0) / REFERENCE_NIGHTS.length);\nconst REVIEW_THRESHOLD = 60;\n\nconst SLEEP_MINUTES = [450, 435, 462, 451, 442, 458, 445, 435, 470, 460, 443, 450, 375, 360];\nconst FATIGUE_LEVELS = [2, 2, 1, 2, 2, 1, 2, 2, 1, 1, 2, 2, 3, 4];\n\nconst SCENARIOS = {\n  trend: \"Dos noches bajo la referencia\",\n  stable: \"Historial estable\",\n  missing: \"Noche sin registro\"\n};\n\nfunction shiftDay(date, offset) {\n  return new Date(Date.parse(date) + offset * DAY_MS).toISOString().slice(0, 10);\n}\n\nfunction missionDay(date) {\n  return 43 + Math.round((Date.parse(date) - Date.parse(MISSION_DATE)) / DAY_MS);\n}\n\nfunction dateLabel(date, style = \"short\") {\n  return new Intl.DateTimeFormat(\"es-CL\", {\n    day: \"numeric\", month: \"short\", ...(style === \"full\" ? { year: \"numeric\" } : {}), timeZone: \"UTC\"\n  }).format(new Date(date)).replace(/\\./g, \"\");\n}\n\nfunction duration(minutes) {\n  const hours = Math.floor(minutes / 60);\n  const rest = minutes % 60;\n  return hours > 0 ? hours + \" h\" + (rest ? \" \" + rest + \" min\" : \"\") : rest + \" min\";\n}\n\nfunction difference(minutes) {\n  const offset = minutes - BASELINE;\n  if (offset === 0) return \"En la referencia\";\n  return (offset \u003c 0 ? \"−\" : \"+\") + duration(Math.abs(offset));\n}\n\nfunction isEntryDate(date) {\n  return /^\\d{4}-\\d{2}-\\d{2}$/.test(date) && date >= shiftDay(MISSION_DATE, -42) &&\n    date \u003c \"9999-12-31\" && Number.isFinite(Date.parse(date)) && shiftDay(date, 0) === date;\n}\n\nfunction validEntry(record) {\n  return record && isEntryDate(record.date) &&\n    Number.isInteger(record.minutes) && record.minutes >= 0 && record.minutes \u003c= MINUTES_PER_DAY &&\n    Number.isInteger(record.fatigue) && record.fatigue >= 1 && record.fatigue \u003c= 5;\n}\n\nfunction initialState() {\n  const data = Object.fromEntries(Object.keys(SCENARIOS).map(name => {\n    const normal = SLEEP_MINUTES.map((minutes, index) => ({\n      date: shiftDay(MISSION_DATE, index - (SLEEP_MINUTES.length - 1)),\n      minutes,\n      fatigue: FATIGUE_LEVELS[index]\n    }));\n    if (name !== \"trend\") {\n      Object.assign(normal.at(-2), { minutes: 444, fatigue: 2 });\n      Object.assign(normal.at(-1), { minutes: 455, fatigue: 2 });\n    }\n    if (name === \"missing\") normal.splice(normal.length - 2, 1);\n    return [name, { records: normal, reports: [] }];\n  }));\n  return { active: \"trend\", data };\n}\n\nfunction loadSleepState() {\n  const defaults = initialState();\n  try {\n    const saved = JSON.parse(localStorage.getItem(SLEEP_STORAGE_KEY));\n    if (!saved || !Object.hasOwn(SCENARIOS, saved.active)) return defaults;\n    defaults.active = saved.active;\n    for (const scenario of Object.keys(SCENARIOS)) {\n      const data = saved.data?.[scenario];\n      if (!data) continue;\n      if (Array.isArray(data.records)) defaults.data[scenario].records = data.records.filter(validEntry);\n      if (Array.isArray(data.reports)) defaults.data[scenario].reports = data.reports.filter(report =>\n        report && typeof report.title === \"string\" && typeof report.note === \"string\" &&\n        typeof report.description === \"string\" && isEntryDate(report.date) &&\n        Array.isArray(report.recent) && report.recent.every(record => record &&\n          isEntryDate(record.date) && (record.minutes === null || validEntry(record))));\n    }\n  } catch {\n    return defaults;\n  }\n  return defaults;\n}\n\nfunction endDate(records) {\n  return records.reduce((latest, record) => record.date > latest ? record.date : latest, MISSION_DATE);\n}\n\nfunction periodRows(records, count, end = endDate(records)) {\n  const byDay = new Map(records.map(record => [record.date, record]));\n  return Array.from({ length: count }, (_, index) => {\n    const date = shiftDay(end, index - count + 1);\n    return byDay.get(date) ?? { date, minutes: null, fatigue: null };\n  });\n}\n\nfunction evaluate(records) {\n  const recent = periodRows(records, 2);\n  const missing = recent.find(record => record.minutes === null);\n  if (missing) return { kind: \"missing\", recent, missing };\n  if (recent.every(record => record.minutes \u003c= BASELINE - REVIEW_THRESHOLD)) return { kind: \"trend\", recent };\n  return { kind: \"stable\", recent };\n}\n\nfunction sleepNote(status) {\n  const [first, last] = status.recent;\n  if (status.kind === \"trend\") {\n    return 'El ' + dateLabel(first.date) + ' dormiste ' + duration(first.minutes) + ' y el ' +\n      dateLabel(last.date) + ', ' + duration(last.minutes) + '. Ambas noches quedaron al menos ' +\n      duration(REVIEW_THRESHOLD) + ' bajo tu referencia de ' + duration(BASELINE) + '.';\n  }\n  if (status.kind === \"missing\") {\n    return 'Falta el registro del ' + dateLabel(status.missing.date) + '. Completa esa noche para evaluar la tendencia de los últimos dos días.';\n  }\n  return 'Las dos noches más recientes no activan el aviso de descenso respecto a tu referencia personal.';\n}\n\nreturn { MISSION_DATE, SLEEP_STORAGE_KEY, BASELINE, REVIEW_THRESHOLD, SCENARIOS, shiftDay, missionDay, dateLabel, duration, difference, isEntryDate, validEntry, initialState, loadSleepState, endDate, periodRows, evaluate, sleepNote };\n})();\nmodules[\"chart.js\"] = (() => {\nconst { BASELINE, dateLabel, duration } = modules[\"model.js\"];\n\nfunction makeSleepChart(canvas, tooltip, liveRegion) {\n  const ctx = canvas.getContext(\"2d\");\n  const plot = canvas.parentElement;\n  let rows = [];\n  let points = [];\n  let selected = -1;\n  let bounds;\n  let chartHeight;\n\n  function select(index, announce = false) {\n    selected = index;\n    draw();\n    if (index \u003c 0 || !points[index]) {\n      tooltip.hidden = true;\n      return;\n    }\n    const point = points[index];\n    const value = dateLabel(point.date) + \" · \" + (point.minutes === null ? \"Sin registro\" : duration(point.minutes));\n    tooltip.textContent = value;\n    tooltip.hidden = false;\n    const left = Math.max(0, Math.min(point.x - tooltip.offsetWidth / 2, bounds.width - tooltip.offsetWidth));\n    const top = Math.max(0, Math.min(point.y - 34, chartHeight - 54));\n    tooltip.style.transform = 'translate(' + left + 'px,' + top + 'px)';\n    if (announce) liveRegion.textContent = value;\n  }\n\n  function draw() {\n    if (!ctx || rows.length === 0) return;\n    bounds = plot.getBoundingClientRect();\n    const width = bounds.width;\n    chartHeight = bounds.height;\n    if (width \u003c 70 || chartHeight \u003c 70) return;\n    const ratio = window.devicePixelRatio || 1;\n    canvas.width = Math.round(width * ratio);\n    canvas.height = Math.round(chartHeight * ratio);\n    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);\n\n    const compact = width \u003c 400;\n    const left = compact ? 31 : 37;\n    const right = width - 12;\n    const top = 14;\n    const bottom = chartHeight - 27;\n    const present = rows.filter(row => row.minutes !== null);\n    const low = Math.max(0, Math.min(300, Math.floor(Math.min(...present.map(row => row.minutes), BASELINE) / 60) * 60 - 60));\n    const high = Math.max(540, Math.ceil(Math.max(...present.map(row => row.minutes), BASELINE) / 60) * 60);\n    const tick = high - low \u003c= 360 ? 60 : (high - low \u003c= 720 ? 120 : 360);\n    const x = index => left + (right - left) * index / Math.max(1, rows.length - 1);\n    const y = minutes => bottom - (minutes - low) * (bottom - top) / (high - low);\n\n    ctx.font = (compact ? '10' : '11') + 'px \"IBM Plex Mono\", monospace';\n    ctx.textBaseline = \"middle\";\n    ctx.textAlign = \"right\";\n    for (let mark = Math.ceil(low / tick) * tick; mark \u003c= high; mark += tick) {\n      ctx.strokeStyle = \"#d8e2d1\";\n      ctx.lineWidth = 1;\n      ctx.beginPath();\n      ctx.moveTo(left, y(mark));\n      ctx.lineTo(right, y(mark));\n      ctx.stroke();\n      ctx.fillStyle = \"#50634f\";\n      ctx.fillText(mark / 60 + \" h\", left - 8, y(mark));\n    }\n\n    points = rows.map((row, index) => ({ ...row, x: x(index), y: row.minutes === null ? bottom - 7 : y(row.minutes) }));\n    const groups = [];\n    let segment = [];\n    for (const point of points) {\n      if (point.minutes === null) {\n        if (segment.length > 0) groups.push(segment);\n        segment = [];\n      } else {\n        segment.push(point);\n      }\n    }\n    if (segment.length > 0) groups.push(segment);\n\n    const gradient = ctx.createLinearGradient(0, top, 0, bottom);\n    gradient.addColorStop(0, \"#50a74836\");\n    gradient.addColorStop(1, \"#50a74806\");\n    for (const group of groups) {\n      ctx.beginPath();\n      ctx.moveTo(group[0].x, bottom);\n      for (const point of group) ctx.lineTo(point.x, point.y);\n      ctx.lineTo(group.at(-1).x, bottom);\n      ctx.closePath();\n      ctx.fillStyle = gradient;\n      ctx.fill();\n    }\n\n    ctx.strokeStyle = \"#856226\";\n    ctx.lineWidth = 1.3;\n    ctx.setLineDash([5, 5]);\n    ctx.beginPath();\n    ctx.moveTo(left, y(BASELINE));\n    ctx.lineTo(right, y(BASELINE));\n    ctx.stroke();\n    ctx.setLineDash([]);\n\n    ctx.strokeStyle = \"#287342\";\n    ctx.lineWidth = 2.2;\n    ctx.lineJoin = \"round\";\n    for (const group of groups) {\n      ctx.beginPath();\n      group.forEach((point, index) => index ? ctx.lineTo(point.x, point.y) : ctx.moveTo(point.x, point.y));\n      ctx.stroke();\n    }\n\n    points.forEach((point, index) => {\n      ctx.beginPath();\n      if (point.minutes === null) {\n        ctx.strokeStyle = \"#63775c\";\n        ctx.lineWidth = 1;\n        ctx.moveTo(point.x, point.y - 4);\n        ctx.lineTo(point.x + 4, point.y);\n        ctx.lineTo(point.x, point.y + 4);\n        ctx.lineTo(point.x - 4, point.y);\n        ctx.closePath();\n        ctx.stroke();\n      } else {\n        ctx.arc(point.x, point.y, selected === index ? 5 : 3, 0, 2 * Math.PI);\n        ctx.fillStyle = selected === index ? \"#204f31\" : \"#287342\";\n        ctx.fill();\n      }\n\n      const last = points.length - 1;\n      const every = Math.max(1, Math.ceil((points.length - 1) / (compact ? 4 : 7)));\n      if ((index % every === 0 && last - index >= every) || index === last) {\n        ctx.textAlign = index === 0 ? \"left\" : index === last ? \"right\" : \"center\";\n        ctx.fillStyle = \"#50634f\";\n        ctx.fillText(dateLabel(point.date), point.x, bottom + 15);\n      }\n    });\n  }\n\n  canvas.addEventListener(\"pointermove\", event => {\n    if (points.length === 0) return;\n    const localX = event.clientX - bounds.left;\n    const { x: start } = points[0];\n    const { x: end } = points.at(-1);\n    if (localX \u003c start - 12 || localX > end + 12) return select(-1);\n    select(Math.max(0, Math.min(points.length - 1, Math.round((localX - start) / (end - start) * (points.length - 1)))));\n  });\n  canvas.addEventListener(\"pointerleave\", () => select(-1));\n  canvas.addEventListener(\"focus\", () => select(points.length - 1, true));\n  canvas.addEventListener(\"blur\", () => select(-1));\n  canvas.addEventListener(\"keydown\", event => {\n    if (![\"ArrowRight\", \"ArrowLeft\", \"Home\", \"End\"].includes(event.key) || points.length === 0) return;\n    event.preventDefault();\n    const direction = event.key === \"ArrowRight\" ? 1 : -1;\n    const target = event.key === \"Home\" ? 0 : event.key === \"End\" ? points.length - 1 : selected + direction;\n    select(Math.max(0, Math.min(points.length - 1, target)), true);\n  });\n\n  new ResizeObserver(() => select(-1)).observe(plot);\n  document.fonts.ready.then(draw);\n  return nextRows => {\n    rows = nextRows;\n    select(-1);\n  };\n}\n\nreturn { makeSleepChart };\n})();\nmodules[\"app.js\"] = (() => {\nconst {\n  BASELINE, MISSION_DATE, REVIEW_THRESHOLD, SCENARIOS, dateLabel, difference, duration, endDate,\n  evaluate, isEntryDate, loadSleepState, missionDay, periodRows, shiftDay, sleepNote, SLEEP_STORAGE_KEY, validEntry\n} = modules[\"model.js\"];\nconst { makeSleepChart } = modules[\"chart.js\"];\n\nconst get = id => document.getElementById(id);\nconst updateChart = makeSleepChart(get(\"sleep-chart\"), get(\"point-detail\"), get(\"chart-reading\"));\nconst entryForm = get(\"entry-form\");\nconst entryDate = get(\"entry-date\");\nconst scenarioDialog = get(\"scenarios-dialog\");\nconst summaryDialog = get(\"summary-dialog\");\nconst summaryForm = get(\"summary-form\");\nconst historyBody = get(\"history-body\");\nconst summaryList = get(\"summary-list\");\nconst periodButtons = [...document.querySelectorAll(\".period\")];\nconst scenarioButtons = [...document.querySelectorAll(\"[data-scenario]\")];\nconst sections = [...document.querySelectorAll('.primary-nav a[href^=\"#\"]')];\nconst fatigueLabels = [\"\", \"Muy baja\", \"Baja\", \"Moderada\", \"Alta\", \"Muy alta\"];\nconst trendLabels = {\n  trend: [\"Revisar tendencia\", \"#i-alert\"],\n  stable: [\"Sin aviso de tendencia\", \"#i-check\"],\n  missing: [\"Falta un registro\", \"#i-calendar\"]\n};\n\nlet state = loadSleepState();\nlet period = 7;\nlet reportDraft;\n\nfunction persist() {\n  try {\n    localStorage.setItem(SLEEP_STORAGE_KEY, JSON.stringify(state));\n    return true;\n  } catch {\n    return false;\n  }\n}\n\nfunction current() {\n  return state.data[state.active];\n}\n\nfunction node(tag, text, className) {\n  const element = document.createElement(tag);\n  if (className) element.className = className;\n  if (text) element.textContent = text;\n  return element;\n}\n\nfunction inputMessage(message = \"\", error = false) {\n  const element = get(\"entry-message\");\n  element.textContent = message;\n  element.hidden = !message;\n  element.classList.toggle(\"error\", error);\n}\n\nfunction setEntry(date, record, focus = false) {\n  entryDate.value = date;\n  get(\"entry-hours\").value = record ? Math.floor(record.minutes / 60) : \"\";\n  get(\"entry-minutes\").value = record ? record.minutes % 60 : \"\";\n  for (const input of entryForm.querySelectorAll('[name=\"fatigue\"]')) {\n    input.checked = Number(input.value) === record?.fatigue;\n  }\n  get(\"entry-submit\").textContent = record ? \"Actualizar registro\" : \"Guardar registro\";\n  inputMessage();\n  if (focus) get(\"entry-hours\").focus();\n}\n\nfunction prepareEntry() {\n  const { records } = current();\n  const status = evaluate(records);\n  setEntry(status.missing?.date ?? shiftDay(endDate(records), 1));\n}\n\nfunction renderStats(records) {\n  const latest = records.toSorted((left, right) => right.date.localeCompare(left.date))[0];\n  get(\"baseline\").textContent = duration(BASELINE);\n  get(\"mission-day\").textContent = \"DÍA \" + String(missionDay(endDate(records))).padStart(3, \"0\");\n  get(\"last-sleep\").textContent = latest ? duration(latest.minutes) : \"—\";\n  const sleepDetail = get(\"last-detail\");\n  sleepDetail.textContent = latest ? dateLabel(latest.date) + \" · \" + difference(latest.minutes) : \"Sin registros\";\n  sleepDetail.classList.toggle(\"alert\", Boolean(latest && latest.minutes \u003c= BASELINE - REVIEW_THRESHOLD));\n  get(\"last-fatigue\").replaceChildren(document.createTextNode(latest ? latest.fatigue + \" \" : \"—\"), node(\"span\", latest ? \"/ 5\" : \"\"));\n  get(\"fatigue-detail\").textContent = latest ? fatigueLabels[latest.fatigue] + \" · Autorreporte del \" + dateLabel(latest.date) : \"Sin autorreporte\";\n}\n\nfunction renderTrend(records) {\n  const status = evaluate(records);\n  const [title, icon] = trendLabels[status.kind];\n  get(\"trend-banner\").className = \"trend-banner card \" + status.kind;\n  get(\"trend-title\").textContent = title;\n  get(\"trend-message\").textContent = sleepNote(status);\n  get(\"trend-icon\").setAttribute(\"href\", icon);\n}\n\nfunction renderChart(records) {\n  for (const button of periodButtons) {\n    const active = Number(button.dataset.days) === period;\n    button.classList.toggle(\"active\", active);\n    button.setAttribute(\"aria-pressed\", String(active));\n  }\n  const rows = periodRows(records, period);\n  get(\"missing-legend\").hidden = !rows.some(row => row.minutes === null);\n  updateChart(rows);\n}\n\nfunction renderHistory(records) {\n  const rows = periodRows(records, 14).reverse().map(record => {\n    const missing = record.minutes === null;\n    const row = node(\"tr\");\n    const action = node(\"button\", missing ? \"Completar\" : \"Editar\", \"text-button\");\n    action.type = \"button\";\n    action.dataset.date = record.date;\n    action.setAttribute(\"aria-label\", (missing ? \"Completar registro del \" : \"Editar registro del \") + dateLabel(record.date));\n    const cell = node(\"td\");\n    cell.append(action);\n    row.append(\n      node(\"td\", dateLabel(record.date, \"full\")),\n      node(\"td\", missing ? \"Sin registro\" : duration(record.minutes), missing ? \"muted\" : \"\"),\n      node(\"td\", missing ? \"—\" : record.fatigue + \" / 5\"),\n      node(\"td\", missing ? \"—\" : difference(record.minutes), !missing && record.minutes \u003c= BASELINE - REVIEW_THRESHOLD ? \"low\" : \"\"),\n      cell\n    );\n    return row;\n  });\n  get(\"history-caption\").textContent = \"Últimos 14 días de la misión simulada\";\n  historyBody.replaceChildren(...rows);\n}\n\nfunction downloadReport(report) {\n  const content = [\n    \"VITA-CORA · RESUMEN PARA REVISIÓN\",\n    \"Tripulante A-01 · Perfil y datos simulados\",\n    \"Fecha de misión: \" + dateLabel(report.date, \"full\"),\n    \"\",\n    report.title,\n    report.description,\n    \"Referencia personal simulada: \" + duration(BASELINE),\n    \"\",\n    ...report.recent.map(record => dateLabel(record.date, \"full\") + \" · \" +\n      (record.minutes === null ? \"Sin registro\" : duration(record.minutes) + \" · Fatiga: \" + record.fatigue + \"/5\")),\n    \"\",\n    \"Nota: \" + (report.note || \"Sin observaciones\"),\n    \"\",\n    \"Fuente contextual NASA: https://www.nasa.gov/hrp/risks/\",\n    \"Prototipo de demostración: regla de aviso simulada.\"\n  ].join(\"\\n\");\n  parent.vitaOffline.download(content, \"vita-cora-\" + report.date + \".txt\");\n}\n\nfunction renderReports(reports) {\n  if (reports.length === 0) {\n    summaryList.replaceChildren(node(\"p\", \"Los resúmenes que guardes aparecerán aquí.\", \"empty-summary\"));\n    return;\n  }\n  summaryList.replaceChildren(...reports.toReversed().map(report => {\n    const article = node(\"article\", \"\", \"saved-report\");\n    const details = node(\"div\", \"\", \"report-details\");\n    details.append(node(\"strong\", report.title + \" · \" + dateLabel(report.date)),\n      node(\"p\", report.note || report.description));\n    const button = node(\"button\", \"\", \"button quiet\");\n    button.type = \"button\";\n    button.innerHTML = '\u003csvg class=\"icon\" aria-hidden=\"true\">\u003cuse href=\"#i-download\"/>\u003c/svg>Descargar';\n    button.setAttribute(\"aria-label\", \"Descargar resumen del \" + dateLabel(report.date));\n    button.addEventListener(\"click\", () => downloadReport(report));\n    article.append(details, button);\n    return article;\n  }));\n}\n\nfunction render() {\n  const { records, reports } = current();\n  renderStats(records);\n  renderChart(records);\n  renderTrend(records);\n  renderHistory(records);\n  renderReports(reports);\n  for (const button of scenarioButtons) {\n    const active = button.dataset.scenario === state.active;\n    button.setAttribute(\"aria-pressed\", String(active));\n    button.querySelector(\".scenario-current\").textContent = active ? \"Activo\" : \"\";\n  }\n}\n\nfunction selectNav() {\n  const target = screen.hash || \"#panel\";\n  for (const link of sections) {\n    const active = link.hash === target;\n    link.classList.toggle(\"selected\", active);\n    if (active) link.setAttribute(\"aria-current\", \"location\");\n    else link.removeAttribute(\"aria-current\");\n  }\n}\n\nentryDate.min = shiftDay(MISSION_DATE, -42);\nentryDate.max = \"9999-12-30\";\nentryDate.addEventListener(\"change\", () => {\n  if (isEntryDate(entryDate.value)) setEntry(entryDate.value, current().records.find(record => record.date === entryDate.value));\n});\nentryForm.addEventListener(\"submit\", event => {\n  event.preventDefault();\n  const data = new FormData(entryForm);\n  const date = String(data.get(\"date\"));\n  const entry = {\n    date,\n    minutes: Number(data.get(\"hours\")) * 60 + Number(data.get(\"minutes\")),\n    fatigue: Number(data.get(\"fatigue\"))\n  };\n  if (!validEntry(entry)) {\n    inputMessage(\"Revisa la fecha y la duración. El máximo es 24 h en una noche.\", true);\n    return;\n  }\n  const records = current().records;\n  const index = records.findIndex(record => record.date === date);\n  const updating = index >= 0;\n  if (updating) records[index] = entry;\n  else records.push(entry);\n  const saved = persist();\n  render();\n  setEntry(date, entry);\n  inputMessage(saved ? (updating ? \"Actualizaste\" : \"Guardaste\") + \" el registro del \" + dateLabel(date) + \".\" :\n    \"El registro queda disponible durante esta sesión. El navegador bloqueó el guardado.\", !saved);\n});\nhistoryBody.addEventListener(\"click\", event => {\n  const date = event.target.closest(\"button[data-date]\")?.dataset.date;\n  if (date) setEntry(date, current().records.find(record => record.date === date), true);\n});\nfor (const button of periodButtons) {\n  button.addEventListener(\"click\", () => {\n    period = Number(button.dataset.days);\n    renderChart(current().records);\n  });\n}\n\nget(\"open-scenarios\").addEventListener(\"click\", () => scenarioDialog.showModal());\nfor (const button of scenarioButtons) {\n  button.addEventListener(\"click\", () => {\n    if (state.active !== button.dataset.scenario) {\n      state.active = button.dataset.scenario;\n      persist();\n      render();\n      prepareEntry();\n    }\n    scenarioDialog.close();\n  });\n}\nfor (const button of document.querySelectorAll(\".about-open\")) {\n  button.addEventListener(\"click\", () => get(\"about-dialog\").showModal());\n}\nfor (const button of document.querySelectorAll(\".close-dialog\")) {\n  button.addEventListener(\"click\", () => button.closest(\"dialog\").close());\n}\nget(\"open-summary\").addEventListener(\"click\", () => {\n  const status = evaluate(current().records);\n  reportDraft = {\n    title: trendLabels[status.kind][0],\n    description: sleepNote(status),\n    date: endDate(current().records),\n    recent: status.recent.map(record => ({ ...record }))\n  };\n  get(\"draft-context\").textContent = reportDraft.description;\n  summaryForm.reset();\n  summaryDialog.showModal();\n  get(\"summary-note\").focus();\n});\nsummaryForm.addEventListener(\"submit\", event => {\n  event.preventDefault();\n  current().reports.push({ ...reportDraft, note: get(\"summary-note\").value.trim() });\n  const saved = persist();\n  renderReports(current().reports);\n  summaryDialog.close();\n  if (!saved) get(\"resumenes\").querySelector(\".card-heading p\").textContent = \"Guardado para esta sesión. El navegador bloqueó el guardado persistente.\";\n  screen.go(\"#resumenes\");\n  get(\"resumenes\").scrollIntoView();\n  summaryList.querySelector(\".saved-report button\")?.focus({ preventScroll: true });\n});\nwindow.addEventListener(\"hashchange\", selectNav);\nselectNav();\nprepareEntry();\nrender();\n\nreturn {  };\n})();\n})();"},"guia":{"title":"Guía interactiva","styles":["styles.css","guia.css","orbital.css"],"html":"\u003c!doctype html>\n\u003chtml lang=\"es-CL\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003cmeta name=\"theme-color\" content=\"#172e22\">\n  \u003cmeta name=\"description\" content=\"Guías animadas de autocuidado y apoyo entre tripulantes para Vita-Cora.\">\n  \u003ctitle>Guía interactiva · Vita-Cora\u003c/title>\n\u003c/head>\n\u003cbody>\n\u003ca class=\"skip\" href=\"#contenido\">Saltar al contenido\u003c/a>\n\u003cdiv class=\"shell\">\n  \u003caside class=\"sidebar\">\n    \u003ca class=\"brand\" href=\"./\">\u003cspan class=\"brand-mark\" data-icon=\"orbit\">\u003c/span>\u003cspan>\u003cstrong>Vita-Cora\u003c/strong>\u003csmall>NASA SPACE APPS 2026\u003c/small>\u003c/span>\u003c/a>\n    \u003cnav class=\"primary-nav\" aria-label=\"Secciones\">\n      \u003ca class=\"nav-link\" href=\"./\" data-nav=\"grid\">Panel general\u003c/a>\n      \u003ca class=\"nav-link selected\" href=\"guia.html\" aria-current=\"page\" data-nav=\"book\">Guía interactiva\u003c/a>\n      \u003ca class=\"nav-link\" href=\"sintomas.html\">\u003csvg class=\"icon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 12h4l3-6 4 12 3-6h4\"/>\u003crect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx >\n        \u003c/div>\n      \u003c/section>\n      \u003csection class=\"guide-choices\" aria-labelledby=\"self-care-title\">\n      \u003ch2 id=\"self-care-title\">Cuidarme\u003c/h2>\n      \u003cnav class=\"guide-topics\" aria-label=\"Cuidarme\">\n        \u003ca class=\"topic selected\" href=\"#pulso\" data-topic=\"pulso\" aria-current=\"location\">\u003cspan class=\"topic-icon\" data-icon=\"heart\">\u003c/span>\u003cspan>\u003cstrong>Pulso\u003c/strong>\u003csmall>Cuenta tus latidos\u003c/small>\u003c/span>\u003cspan class=\"topic-arrow\" data-icon=\"chevron\">\u003c/span>\u003c/a>\n        \u003ca class=\"topic\" href=\"#temperatura\" data-topic=\"temperatura\">\u003cspan class=\"topic-icon\" data-icon=\"thermometer\">\u003c/span>\u003cspan>\u003cstrong>Temperatura\u003c/strong>\u003csmall>Usa un termómetro digital\u003c/small>\u003c/span>\u003cspan class=\"topic-arrow\" data-icon=\"chevron\">\u003c/span>\u003c/a>\n        \u003ca class=\"topic\" href=\"#pausa\" data-topic=\"pausa\">\u003cspan class=\"topic-icon\" data-icon=\"orbit\">\u003c/span>\u003cspan>\u003cstrong>Pausa orbital\u003c/strong>\u003csmall>Respiración guiada · 45 segundos\u003c/small>\u003c/span>\u003cspan class=\"topic-arrow\" data-icon=\"chevron\">\u003c/span>\u003c/a>\n      \u003c/nav>\n      \u003c/section>\n      \u003csection class=\"guide-choices\" aria-labelledby=\"support-title\">\n        \u003ch2 id=\"support-title\">Ayudar a un compañero\u003c/h2>\n        \u003cp class=\"support-site-note\">En una emergencia real, avisa por el canal de la misión y sigue el protocolo a bordo.\u003c/p>\n        \u003cnav class=\"guide-topics\" aria-label=\"Ayudar a un compañero\">\n          \u003ca class=\"topic support-topic\" href=\"#no-responde\" data-topic=\"no-responde\">\u003cspan class=\"topic-icon\" data-icon=\"alert\">\u003c/span>\u003cspan>\u003cstrong>No responde\u003c/strong>\u003csmall>Avisa y comprueba la respiración\u003c/small>\u003c/span>\u003cspan class=\"topic-arrow\" data-icon=\"chevron\">\u003c/span>\u003c/a>\n          \u003ca class=\"topic support-topic\" href=\"#herida\" data-topic=\"herida\">\u003cspan class=\"topic-icon\" data-icon=\"bandage\">\u003c/span>\u003cspan>\u003cstrong>Herida con sangrado\u003c/strong>\u003csmall>Aplica presión y pide ayuda\u003c/small>\u003c/span>\u003cspan class=\"topic-arrow\" data-icon=\"chevron\">\u003c/span>\u003c/a>\n          \u003ca class=\"topic support-topic\" href=\"#desorientacion\" data-topic=\"desorientacion\">\u003cspan class=\"topic-icon\" data-icon=\"compass\">\u003c/span>\u003cspan>\u003cstrong>Mareo o desorientación\u003c/strong>\u003csmall>Detén la tarea y evalúa la urgencia\u003c/small>\u003c/span>\u003cspan class=\"topic-arrow\" data-icon=\"chevron\">\u003c/span>\u003c/a>\n        \u003c/nav>\n      \u003c/section>\n      \u003csection class=\"orbital-break card\" id=\"pausa\" aria-labelledby=\"break-title\" hidden>\n        \u003cdiv class=\"break-window\">\n          \u003cdiv class=\"break-window-bar\">\n            \u003cspan>\u003ci aria-hidden=\"true\">\u003c/i>\u003cspan id=\"break-window-status\" aria-hidden=\"true\">Ventana de observación\u003c/span>\u003c/span>\n            \u003ctime id=\"break-clock\" role=\"timer\" datetime=\"PT45S\" aria-label=\"Tiempo restante\">00:45\u003c/time>\n          \u003c/div>\n          \u003cdiv class=\"break-sky\">\n            \u003csvg class=\"break-landscape\" viewBox=\"0 0 640 320\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"Un cohete da vueltas alrededor de la Luna y vuelve a la plataforma de aterrizaje.\">\n              \u003cdefs>\n                \u003clinearGradient id=\"break-night\" x2=\"0\" y2=\"1\" gradientUnits=\"objectBoundingBox\">\n                  \u003cstop stop-color=\"#13272d\"/>\u003cstop offset=\"1\" stop-color=\"#203d36\"/>\n                \u003c/linearGradient>\n                \u003cradialGradient id=\"break-moon-glow\">\n                  \u003cstop stop-color=\"#9bbf8a\" stop-opacity=\".28\"/>\u003cstop offset=\"1\" stop-color=\"#9bbf8a\" stop-opacity=\"0\"/>\n                \u003c/radialGradient>\n                \u003clinearGradient id=\"break-moon\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\" gradientUnits=\"objectBoundingBox\">\n                  \u003cstop stop-color=\"#d1dcaf\"/>\u003cstop offset=\".56\" stop-color=\"#a9bd96\"/>\u003cstop offset=\"1\" stop-color=\"#5e826b\"/>\n                \u003c/linearGradient>\n                \u003clinearGradient id=\"break-exhaust\">\n                  \u003cstop stop-color=\"#b0d3a7\" stop-opacity=\"0\"/>\u003cstop offset=\"1\" stop-color=\"#b0d3a7\" stop-opacity=\".76\"/>\n                \u003c/linearGradient>\n                \u003cclipPath id=\"break-moon-disc\">\u003ccircle cx=\"509\" cy=\"145\" r=\"83\"/>\u003c/clipPath>\n              \u003c/defs>\n              \u003crect width=\"640\" height=\"320\" fill=\"url(#break-night)\"/>\n              \u003cpath d=\"M0 259h82v-8h76v-9h82v-8h91v5h105v-8h82v-6h122v95H0z\" fill=\"#476d58\" opacity=\".2\"/>\n              \u003cpath d=\"M0 286h100v-7h102v4h85v-11h94v-8h100v6h77v-10h82v60H0z\" fill=\"#52795e\" opacity=\".22\"/>\n              \u003cg fill=\"#b6d4ad\" opacity=\".6\">\n                \u003cpath d=\"M34 54h3v3h-3zM96 33h2v2h-2zM183 37h3v3h-3zM221 97h2v2h-2zM260 29h2v2h-2zM302 20h2v2h-2zM362 51h3v3h-3zM442 34h4v4h-4zM542 26h3v3h-3zM590 80h3v3h-3zM616 46h2v2h-2zM609 126h2v2h-2zM48 126h2v2h-2zM72 166h3v3h-3zM182 177h2v2h-2zM359 146h3v3h-3zM420 132h2v2h-2zM573 249h3v3h-3zM163 261h2v2h-2zM299 257h3v3h-3zM385 275h3v3h-3z\"/>\n                \u003cpath d=\"M107 94h2v9h-2zM103 98h10v1h-10zM324 81h2v9h-2zM320 85h10v1h-10zM603 212h2v10h-2zM599 216h10v2h-10z\"/>\n              \u003c/g>\n              \u003cg transform=\"translate(-189 15)\">\n                \u003ccircle cx=\"509\" cy=\"145\" r=\"121\" fill=\"url(#break-moon-glow)\"/>\n                \u003ccircle cx=\"509\" cy=\"145\" r=\"83\" fill=\"url(#break-moon)\"/>\n                \u003cg clip-path=\"url(#break-moon-disc)\">\n                  \u003cpath d=\"M419 179h20v-7h29v-12h37v-8h33v-19h27v-12h35v112H419z\" fill=\"#7e9b7b\" opacity=\".44\"/>\n                  \u003cpath d=\"M453 205h23v-7h33v-13h26v-9h36v-12h32v72H453z\" fill=\"#69886e\" opacity=\".51\"/>\n                  \u003cg fill=\"#748f73\" opacity=\".65\">\n                    \u003cpath d=\"M453 126h7v-8h21v5h9v8h-6v8h-23v-5h-8zM501 107h8v-8h20v5h10v11h-9v6h-21v-5h-8zM519 150h9v-6h26v7h7v9h-8v8h-24v-5h-10zM478 175h8v-7h18v5h7v10h-9v5h-16v-5h-8zM550 193h10v-7h22v11h-8v6h-15v-5h-9z\"/>\n                  \u003c/g>\n                  \u003cpath d=\"M436 149h9v-10h8m52-54h19m-6 6h16m28 37h11m-32 47h13m-71 25h18\" fill=\"none\" stroke=\"#d5dfb0\" stroke-width=\"3\" opacity=\".45\"/>\n                \u003c/g>\n                \u003ccircle cx=\"509\" cy=\"145\" r=\"83\" fill=\"none\" stroke=\"#cfe2b5\" stroke-opacity=\".58\" stroke-width=\"1.5\"/>\n              \u003c/g>\n              \u003cpath class=\"break-orbit break-rise\" d=\"M320 260C262 260 212.5 216 212.5 160C212.5 100 258 45 320 45\"/>\n              \u003cpath class=\"break-orbit break-fall\" d=\"M320 45C382 45 427.5 100 427.5 160C427.5 216 378 260 320 260\"/>\n              \u003cg aria-hidden=\"true\">\n                \u003cpath d=\"M305 244h30m-26 0v-4m22 4v-4\" fill=\"none\" stroke=\"#dbebbd\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n                \u003cpath d=\"M306 245h28v3h-28z\" fill=\"#789a78\" opacity=\".58\"/>\n              \u003c/g>\n              \u003cg id=\"break-ship\" transform=\"translate(320 260) rotate(90)\">\n                \u003cpath id=\"break-thrust\" d=\"M-37-3h21v6h-21zM-44-.75h27v1.5h-27z\" fill=\"url(#break-exhaust)\" opacity=\"0\"/>\n                \u003cpath d=\"M-5-4l-10-8h-2v8m12 8-10 8h-2V4\" fill=\"#86a589\" stroke=\"#315046\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\n                \u003cpath d=\"M-16-5H-7l5-3H8l7 3 5 5-5 5-7 3H-2l-5-3h-9z\" fill=\"#e2ebcd\" stroke=\"#345447\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\n                \u003cpath d=\"M5-4h7l5 4-5 3H5z\" fill=\"#507b74\"/>\n                \u003cpath d=\"M-14-4h4v8h-4z\" fill=\"#9ac289\"/>\n              \u003c/g>\n              \u003cpath d=\"M0 30h12V12h24m568 0h24v18h12M0 290h12v18h24m568 0h24v-18h12\" fill=\"none\" stroke=\"#a0c78f\" stroke-width=\"2\" opacity=\".5\"/>\n            \u003c/svg>\n          \u003c/div>\n          \u003cprogress id=\"break-progress\" max=\"45\" value=\"0\" aria-label=\"Avance de la pausa\">\u003c/progress>\n        \u003c/div>\n        \u003cdiv class=\"break-console\">\n          \u003ch2 id=\"break-title\">Pausa orbital\u003c/h2>\n          \u003cp>Cuando tu tarea lo permita, acompaña al cohete durante cinco vueltas en 45 segundos. Inhala en la subida y exhala en el descenso. Sigue el ritmo que te resulte cómodo.\u003c/p>\n          \u003cdiv class=\"break-cue\" role=\"status\">\n            \u003cstrong id=\"break-cue-title\">Haz espacio para una pausa\u003c/strong>\n            \u003cp id=\"break-cue-text\">Puedes parar cuando quieras.\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"break-actions\">\n            \u003cbutton class=\"button primary\" id=\"break-toggle\" type=\"button\">Iniciar pausa\u003c/button>\n            \u003cbutton class=\"button quiet\" id=\"break-end\" type=\"button\" hidden>Terminar antes\u003c/button>\n          \u003c/div>\n        \u003c/div>\n      \u003c/section>\n      \u003cdiv class=\"guide-grid\" id=\"guide-player\">\n        \u003cfigure class=\"diagram card\">\n          \u003cdiv class=\"diagram-header\">\u003cspan id=\"diagram-tag\" class=\"diagram-tag\">MUÑECA · VISTA INTERIOR\u003c/span>\u003cspan id=\"diagram-counter\">01 / 03\u003c/span>\u003c/div>\n          \u003ccanvas id=\"diagram-canvas\" role=\"img\" aria-label=\"Ilustración de la posición de los dedos para tomar el pulso en la muñeca.\">\u003c/canvas>\n          \u003cfigcaption>\u003cspan id=\"diagram-caption\">\u003c/span>\u003cbutton class=\"button quiet\" id=\"animation-toggle\" type=\"button\">\u003c/button>\u003c/figcaption>\n        \u003c/figure>\n        \u003csection class=\"lesson card\" aria-labelledby=\"step-title\">\n          \u003cdiv class=\"lesson-kicker\" id=\"lesson-topic\">\u003c/div>\n          \u003cdiv class=\"lesson-progress\" id=\"step-picker\" role=\"group\" aria-label=\"Pasos de la guía\">\u003c/div>\n          \u003cdiv class=\"lesson-copy\" aria-live=\"polite\" aria-atomic=\"true\">\n            \u003ch2 id=\"step-title\">\u003c/h2>\u003cp id=\"step-text\">\u003c/p>\n            \u003cp class=\"lesson-tip\">\u003cspan data-icon=\"info\">\u003c/span>\u003cspan id=\"step-tip\">\u003c/span>\u003c/p>\n          \u003c/div>\n          \u003cdiv class=\"lesson-actions\">\n            \u003cbutton class=\"button quiet\" id=\"previous-step\" type=\"button\">Atrás\u003c/button>\n            \u003cbutton class=\"button primary\" id=\"next-step\" type=\"button\">Siguiente paso\u003c/button>\n          \u003c/div>\n        \u003c/section>\n      \u003c/div>\n      \u003cdiv id=\"support-simulator\" class=\"card support-simulator\" hidden>\n        \u003cdiv>\u003cstrong>Practica el aviso a bordo\u003c/strong>\u003cp>El simulador te permite ensayar el aviso si un compañero no responde.\u003c/p>\u003c/div>\n        \u003ca class=\"button quiet\" href=\"mision.html#companero\">Abrir simulador \u003cspan data-icon=\"arrow\">\u003c/span>\u003c/a>\n      \u003c/div>\n      \u003csection id=\"practice-card\" class=\"card practice-card\" aria-labelledby=\"practice-title\" hidden>\n        \u003cdiv class=\"card-heading\">\u003cdiv>\u003ch2 id=\"practice-title\">Registra un ejemplo\u003c/h2>\u003cp id=\"practice-description\">\u003c/p>\u003c/div>\u003cspan class=\"topic-icon\" data-icon=\"doc\">\u003c/span>\u003c/div>\n        \u003cform id=\"practice-form\">\n          \u003clabel class=\"field-label\" for=\"practice-value\" id=\"practice-label\">\u003c/label>\n          \u003cdiv class=\"practice-controls\">\u003cselect class=\"field\" id=\"practice-value\" required>\u003c/select>\u003cbutton class=\"button primary\" id=\"practice-submit\" type=\"submit\">Guardar ejemplo\u003c/button>\u003c/div>\n          \u003cp id=\"practice-feedback\" role=\"status\" hidden>\u003c/p>\n        \u003c/form>\n      \u003c/section>\n      \u003csection id=\"practice-history\" class=\"card practice-card\" aria-labelledby=\"practice-history-title\">\n        \u003cdiv class=\"card-heading\">\u003cdiv>\u003ch2 id=\"practice-history-title\">Registros de práctica\u003c/h2>\u003cp id=\"practice-intro\">Los ejemplos guardados aparecerán aquí.\u003c/p>\u003c/div>\u003c/div>\n        \u003cul id=\"practice-list\">\u003c/ul>\n      \u003c/section>\n      \u003csection class=\"card nasa-measures\" id=\"mediciones-nasa\" aria-labelledby=\"nasa-title\">\n        \u003ch2 id=\"nasa-title\">Qué mide NASA durante sus estudios\u003c/h2>\n        \u003cp>Estas fichas explican las pruebas de investigación y qué información puedes aportar al equipo de salud.\u003c/p>\n        \u003cdiv class=\"measure-grid\">\n          \u003cdetails data-medida=\"actigrafia\">\u003csummary>\u003cspan class=\"measure-tag\">Sueño\u003c/span>\u003cstrong>Actigrafía\u003c/strong>\u003c/summary>\u003cp>Un reloj de muñeca registra movimiento y exposición a la luz. Si tu compañero está cansado, pueden anotar los horarios de sueño y los cambios de turno para aportar contexto.\u003c/p>\u003ca class=\"text-button measure-link\" href=\"https://www.youtube.com/watch?v=LSdfsukudfo\" target=\"_blank\" rel=\"noopener\" aria-label=\"Ver video de NASA sobre Actigrafía\">Ver video de NASA \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\u003c/details>\n          \u003cdetails data-medida=\"sueno\">\u003csummary>\u003cspan class=\"measure-tag\">Sueño y equipo\u003c/span>\u003cstrong>Cuestionario de sueño y equipo\u003c/strong>\u003c/summary>\u003cp>NASA recoge información sobre el descanso al despertar y sobre el ánimo y la convivencia antes de dormir. Cada tripulante informa su propia experiencia.\u003c/p>\u003ca class=\"text-button measure-link\" href=\"https://lsda.jsc.nasa.gov/Experiment/exper/25032\" target=\"_blank\" rel=\"noopener\" aria-label=\"Consultar ficha de NASA sobre Cuestionario de sueño y equipo\">Consultar ficha de NASA \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\u003c/details>\n          \u003cdetails data-medida=\"cognicion\">\u003csummary>\u003cspan class=\"measure-tag\">Atención y memoria\u003c/span>\u003cstrong>Cognición\u003c/strong>\u003c/summary>\u003cp>Una batería de pruebas informáticas estudia habilidades como la memoria y la toma de decisiones. Si un compañero se desorienta de repente, activa el protocolo a bordo y deja las pruebas para el equipo de salud.\u003c/p>\u003ca class=\"text-button measure-link\" href=\"https://www.youtube.com/watch?v=E-VZrsBC2xM\" target=\"_blank\" rel=\"noopener\" aria-label=\"Ver video de NASA sobre Cognición\">Ver video de NASA \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\u003c/details>\n          \u003cdetails data-medida=\"equilibrio\">\u003csummary>\u003cspan class=\"measure-tag\">Coordinación\u003c/span>\u003cstrong>Pruebas de movimiento y equilibrio\u003c/strong>\u003c/summary>\u003cp>El equipo de investigación estudia el movimiento, el equilibrio y medidas como el pulso y la presión. Puedes describir cuándo apareció el mareo o en qué tarea notaste el cambio.\u003c/p>\u003ca class=\"text-button measure-link\" href=\"https://www.youtube.com/watch?v=o1fUWuk3osU\" target=\"_blank\" rel=\"noopener\" aria-label=\"Ver video de NASA sobre Pruebas de movimiento y equilibrio\">Ver video de NASA \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\u003c/details>\n          \u003cdetails data-medida=\"personalidad\">\u003csummary>\u003cspan class=\"measure-tag\">Preparación del equipo\u003c/span>\u003cstrong>Cuestionario de personalidad\u003c/strong>\u003c/summary>\u003cp>Se aplica antes del vuelo y ayuda a interpretar otros cuestionarios de equipo. Para apoyar a un compañero en el momento, céntrate en lo que dice que necesita.\u003c/p>\u003ca class=\"text-button measure-link\" href=\"https://lsda.jsc.nasa.gov/Experiment/exper/25031\" target=\"_blank\" rel=\"noopener\" aria-label=\"Consultar ficha de NASA sobre Cuestionario de personalidad\">Consultar ficha de NASA \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\u003c/details>\n          \u003cdetails data-medida=\"marcadores\">\u003csummary>\u003cspan class=\"measure-tag\">Laboratorio\u003c/span>\u003cstrong>Marcadores bioquímicos\u003c/strong>\u003c/summary>\u003cp>Se analizan sustancias de muestras de sangre y orina. El personal capacitado interpreta los resultados con el contexto de cada estudio.\u003c/p>\u003ca class=\"text-button measure-link\" href=\"https://www.youtube.com/watch?v=lv9LZfOeRuo\" target=\"_blank\" rel=\"noopener\" aria-label=\"Ver video de NASA sobre Marcadores bioquímicos\">Ver video de NASA \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\u003c/details>\n          \u003cdetails data-medida=\"carotida\">\u003csummary>\u003cspan class=\"measure-tag\">Ecografía\u003c/span>\u003cstrong>Grosor de la pared de la carótida\u003c/strong>\u003c/summary>\u003cp>Una ecografía permite estudiar cambios en la pared de una arteria del cuello. La medición y su interpretación corresponden al equipo capacitado.\u003c/p>\u003ca class=\"text-button measure-link\" href=\"https://www.youtube.com/watch?v=5DXI_RPhXu8\" target=\"_blank\" rel=\"noopener\" aria-label=\"Ver video de NASA sobre Grosor de la pared de la carótida\">Ver video de NASA \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\u003c/details>\n          \u003cdetails data-medida=\"celulas\">\u003csummary>\u003cspan class=\"measure-tag\">Laboratorio\u003c/span>\u003cstrong>Perfil celular\u003c/strong>\u003c/summary>\u003cp>Las muestras de sangre y saliva aportan información sobre las células sanguíneas, el estrés y el sistema inmunitario. El laboratorio y el equipo de salud se encargan de la evaluación.\u003c/p>\u003ca class=\"text-button measure-link\" href=\"https://www.youtube.com/watch?v=DHkIkk4Ujgo\" target=\"_blank\" rel=\"noopener\" aria-label=\"Ver video de NASA sobre Perfil celular\">Ver video de NASA \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\u003c/details>\n          \u003cdetails data-medida=\"microbioma\">\u003csummary>\u003cspan class=\"measure-tag\">Laboratorio\u003c/span>\u003cstrong>Microbioma\u003c/strong>\u003c/summary>\u003cp>El equipo de investigación estudia los microorganismos que viven en el cuerpo y cómo cambian durante el vuelo mediante el análisis de muestras.\u003c/p>\u003ca class=\"text-button measure-link\" href=\"https://www.youtube.com/watch?v=qOZFfUyOw8s\" target=\"_blank\" rel=\"noopener\" aria-label=\"Ver video de NASA sobre Microbioma\">Ver video de NASA \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\u003c/details>\n        \u003c/div>\n        \u003ca class=\"text-button\" href=\"https://www.nasa.gov/humans-in-space/spaceflight-standard-measures-characterizing-how-humans-adapt-in-space/\" target=\"_blank\" rel=\"noopener\">Fuente NASA · Spaceflight Standard Measures \u003cspan data-icon=\"external\">\u003c/span>\u003c/a>\n      \u003c/section>\n      \u003cfooter class=\"footer guide-footer\">\n        \u003cspan>Guía educativa. En una misión real, sigue el protocolo y las instrucciones del equipo de salud.\u003c/span>\n        \u003ca id=\"topic-source\" class=\"text-button\" target=\"_blank\" rel=\"noopener\">\u003c/a>\n      \u003c/footer>\n    \u003c/main>\n  \u003c/div>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","script":"(() => {\n\"use strict\";\nconst screen = window.vitaScreen;\nconst localStorage = parent.vitaOffline.storage;\nconst modules = Object.create(null);\nmodules[\"guia-pausa.js\"] = (() => {\nconst SECONDS = 45;\nconst DURATION = SECONDS * 1000;\nconst LAP = 9000;\nconst RISE = 4000;\nconst MOON_X = 320;\nconst MOON_Y = 160;\nconst LANDING_RADIUS = 100;\nconst CUES = {\n  rise: [\"Inhala suave\", \"Acompaña al cohete mientras despega y sube.\"],\n  fall: [\"Exhala suave\", \"Suelta el aire mientras el cohete desciende y aterriza.\"]\n};\n\nfunction makeOrbitalBreak(panel) {\n  const clock = panel.querySelector(\"#break-clock\");\n  const progress = panel.querySelector(\"#break-progress\");\n  const toggle = panel.querySelector(\"#break-toggle\");\n  const end = panel.querySelector(\"#break-end\");\n  const title = panel.querySelector(\"#break-cue-title\");\n  const hint = panel.querySelector(\"#break-cue-text\");\n  const windowStatus = panel.querySelector(\"#break-window-status\");\n  const ship = panel.querySelector(\"#break-ship\");\n  const thrust = panel.querySelector(\"#break-thrust\");\n  const landingPosition = ship.getAttribute(\"transform\");\n  const reducedMotion = window.matchMedia(\"(prefers-reduced-motion: reduce)\");\n  let state = \"ready\";\n  let remaining = DURATION;\n  let deadline = 0;\n  let frame;\n\n  function setCue(heading, text) {\n    title.textContent = heading;\n    hint.textContent = text;\n  }\n\n  function updateClock() {\n    const seconds = Math.ceil(remaining / 1000);\n    const formatted = \"00:\" + String(seconds).padStart(2, \"0\");\n    if (clock.textContent !== formatted) {\n      clock.textContent = formatted;\n      clock.dateTime = \"PT\" + seconds + \"S\";\n      progress.value = SECONDS - seconds;\n    }\n  }\n\n  function updateOrbit() {\n    const elapsed = (DURATION - remaining) % LAP;\n    if (reducedMotion.matches || elapsed === 0) {\n      ship.setAttribute(\"transform\", landingPosition);\n      thrust.setAttribute(\"opacity\", \"0\");\n      return;\n    }\n\n    const rising = elapsed \u003c RISE;\n    const fraction = rising ? elapsed / RISE : (elapsed - RISE) / (LAP - RISE);\n    const eased = (1 - Math.cos(Math.PI * fraction)) / 2;\n    const lapProgress = (eased + (rising ? 0 : 1)) / 2;\n    const arc = Math.PI * (0.5 + 2 * lapProgress);\n    const glide = Math.sin(Math.PI * lapProgress);\n    const radius = LANDING_RADIUS + 15 * glide ** 2;\n    const x = MOON_X + radius * Math.cos(arc);\n    const y = MOON_Y + radius * Math.sin(arc);\n    const angle = arc * 180 / Math.PI + 90 * glide;\n    ship.setAttribute(\"transform\", \"translate(\" + x + \" \" + y + \") rotate(\" + angle + \")\");\n    thrust.setAttribute(\"opacity\", String(0.7 * glide ** 2));\n  }\n\n  function showBreath(phase) {\n    if (panel.dataset.breath === phase) return;\n    panel.dataset.breath = phase;\n    windowStatus.textContent = phase === \"rise\" ? \"Inhala\" : \"Exhala\";\n    setCue(...CUES[phase]);\n  }\n\n  function updateActions() {\n    toggle.textContent = {\n      ready: \"Iniciar pausa\",\n      running: \"Pausar\",\n      paused: \"Continuar\",\n      done: \"Repetir pausa\"\n    }[state];\n    end.hidden = state !== \"running\" && state !== \"paused\";\n    clock.hidden = state === \"done\" && remaining > 0;\n  }\n\n  function finish(completed) {\n    const focusEnd = document.activeElement === end;\n    cancelAnimationFrame(frame);\n    state = \"done\";\n    if (completed) remaining = 0;\n    updateClock();\n    updateOrbit();\n    updateActions();\n    delete panel.dataset.breath;\n    windowStatus.textContent = \"Pausa finalizada\";\n    setCue(\"Pausa finalizada\", \"Retoma tu tarea cuando estés listo.\");\n    if (focusEnd) toggle.focus({ preventScroll: true });\n  }\n\n  function tick(now) {\n    remaining = Math.max(0, deadline - now);\n    if (!remaining) {\n      finish(true);\n      return;\n    }\n    updateClock();\n    updateOrbit();\n    showBreath((DURATION - remaining) % LAP \u003c RISE ? \"rise\" : \"fall\");\n  }\n\n  function animate(now) {\n    if (state !== \"running\") return;\n    tick(now);\n    if (state === \"running\") frame = requestAnimationFrame(animate);\n  }\n\n  function pause() {\n    if (state !== \"running\") return;\n    tick(performance.now());\n    if (state !== \"running\") return;\n    cancelAnimationFrame(frame);\n    state = \"paused\";\n    updateActions();\n    delete panel.dataset.breath;\n    windowStatus.textContent = \"Pausa en espera\";\n    setCue(\"Pausa en espera\", \"Puedes seguir con tu respiración habitual hasta que quieras continuar.\");\n  }\n\n  toggle.addEventListener(\"click\", () => {\n    if (state === \"running\") {\n      pause();\n      return;\n    }\n    if (state !== \"paused\") remaining = DURATION;\n    state = \"running\";\n    const now = performance.now();\n    deadline = now + remaining;\n    updateActions();\n    animate(now);\n  });\n\n  end.addEventListener(\"click\", () => {\n    if (state === \"running\") tick(performance.now());\n    if (state !== \"done\") finish(false);\n  });\n\n  reducedMotion.addEventListener(\"change\", updateOrbit);\n  document.addEventListener(\"visibilitychange\", () => {\n    if (document.hidden) pause();\n  });\n  window.addEventListener(\"pagehide\", pause);\n  return pause;\n}\n\nreturn { makeOrbitalBreak };\n})();\nmodules[\"guia-animacion.js\"] = (() => {\nconst PALETTES = {\n  pulso: { accent: \"#c8f57d\", soft: \"#546b35\", ink: \"#21442f\" },\n  temperatura: { accent: \"#ffd28f\", soft: \"#6c5736\", ink: \"#3d3926\" },\n  \"no-responde\": { accent: \"#ffd592\", soft: \"#80694b\", ink: \"#42372b\" },\n  herida: { accent: \"#f6dfaa\", soft: \"#7d7054\", ink: \"#3c3b2d\" },\n  desorientacion: { accent: \"#ffdb9b\", soft: \"#846541\", ink: \"#3a3528\" }\n};\nconst WIDTH = 560;\nconst HEIGHT = 275;\n\nfunction makeIllustration(canvas) {\n  const ctx = canvas.getContext(\"2d\", { alpha: false });\n  let topic = \"pulso\";\n  let step = 0;\n  let playing = false;\n  let elapsed = 0;\n  let frame = 0;\n  let startedAt = null;\n  let sceneScale = 1;\n  const wrist = new Path2D(\"M106 179 C144 174 174 171 206 157 C226 147 236 136 249 127 L275 96 C281 89 292 89 298 96 C305 103 301 112 295 121 L280 141 C291 139 305 135 319 132 L370 120 C380 118 387 123 388 130 C390 136 386 142 379 145 L331 161 L407 147 C417 145 424 151 425 158 C426 165 421 171 412 173 L337 189 L405 181 C414 180 420 186 420 193 C420 200 414 206 407 206 L335 214 L378 214 C388 214 394 220 393 226 C393 233 387 238 378 238 L301 239 C275 239 254 231 229 222 C196 210 149 221 107 227 Z\");\n  const fingers = new Path2D(\"M332 2 L396 1 L384 29 C379 42 372 48 358 56 L329 76 L267 155 C261 163 250 164 244 158 C239 153 239 145 245 138 L289 82 L251 109 L223 143 C217 151 206 151 200 145 C195 139 196 131 203 123 L241 81 L271 50 C281 40 293 38 303 33 Z\");\n  const torso = new Path2D(\"M164 40 L196 40 C199 56 214 60 233 66 C250 71 258 86 257 103 C256 114 247 122 240 128 L241 230 L124 230 L130 127 C117 120 111 112 111 100 C111 84 123 72 141 65 C155 59 162 53 164 40 Z\");\n  const arm = new Path2D(\"M227 70 C244 64 256 70 271 87 L321 147 C327 154 327 168 324 175 C320 186 302 191 293 178 L252 123 C247 117 242 116 237 118 C224 122 211 115 207 102 C202 88 212 75 227 70 Z\");\n  const sleeve = new Path2D(\"M224 72 C243 64 257 74 270 88 L289 110 L255 132 L248 124 C243 119 239 118 234 117 C221 117 211 111 207 100 C204 88 212 77 224 72 Z\");\n\n  function shape(path, fill, stroke, width = 2.5) {\n    ctx.fillStyle = fill;\n    ctx.strokeStyle = stroke;\n    ctx.lineWidth = width;\n    ctx.fill(path);\n    ctx.stroke(path);\n  }\n\n  function box(x, y, width, height, radius, fill, stroke) {\n    ctx.beginPath();\n    ctx.roundRect(x, y, width, height, radius);\n    if (fill) {\n      ctx.fillStyle = fill;\n      ctx.fill();\n    }\n    if (stroke) {\n      ctx.lineWidth = 1.4;\n      ctx.strokeStyle = stroke;\n      ctx.stroke();\n    }\n  }\n\n  function line(points, color, width = 1.5) {\n    ctx.beginPath();\n    ctx.moveTo(points[0][0], points[0][1]);\n    for (const p of points.slice(1)) ctx.lineTo(p[0], p[1]);\n    ctx.lineWidth = width;\n    ctx.strokeStyle = color;\n    ctx.stroke();\n  }\n\n  function circle(x, y, radius, fill, stroke, width = 1.5) {\n    ctx.beginPath();\n    ctx.arc(x, y, radius, 0, Math.PI * 2);\n    if (fill) {\n      ctx.fillStyle = fill;\n      ctx.fill();\n    }\n    if (stroke) {\n      ctx.lineWidth = width;\n      ctx.strokeStyle = stroke;\n      ctx.stroke();\n    }\n  }\n\n  function label(text, x, y, color, size = 13) {\n    const fontSize = Math.max(size, 11 / sceneScale);\n    ctx.font = '650 ' + fontSize + 'px Geist, system-ui, sans-serif';\n    ctx.textBaseline = \"middle\";\n    ctx.textAlign = \"center\";\n    ctx.fillStyle = color;\n    ctx.fillText(text, x, y);\n  }\n\n  function signal(x, y, tone, progress, radius = 14) {\n    circle(x, y, radius + progress * radius, null, tone.soft, Math.max(1, 3 - progress * 1.5));\n    circle(x, y, radius, null, tone.accent, 2.25);\n    circle(x, y, 3.5, tone.accent);\n  }\n\n  function pulse(tone, time) {\n    const beat = time ? (time % 1150) / 1150 : .3;\n    const drop = time ? 12 + Math.cos(time / 400) * 8 : 12;\n    box(76, 166, 412, 76, 18, \"#14263b\", \"#2a455d\");\n    line([[95, 227], [467, 227]], \"#29435b\");\n\n    shape(wrist, \"#294452\", \"#a6c6c9\");\n    line([[294, 146], [280, 158], [271, 174]], \"#779da5\");\n    line([[311, 171], [297, 186], [289, 206]], \"#779da5\");\n    line([[241, 161], [231, 178], [219, 198]], \"#628a92\");\n    if (step \u003c 2) {\n      ctx.save();\n      ctx.translate(24, drop);\n      shape(fingers, \"#486471\", \"#c0dad8\");\n      line([[278, 52], [257, 75], [238, 95]], \"#90b0b4\");\n      ctx.restore();\n    }\n    signal(235, 171, tone, beat, 15);\n\n    if (step === 0) {\n      line([[172, 93], [188, 93], [227, 153]], tone.accent, 2);\n      box(55, 76, 117, 34, 4, \"#142d23\", tone.soft);\n      label(\"DOS DEDOS\", 113, 93, tone.accent, 14);\n      line([[276, 143], [347, 101], [369, 101]], \"#bcd8d7\", 1.8);\n      circle(276, 143, 2.5, \"#dceeed\");\n      box(369, 84, 180, 34, 4, \"#142d23\", \"#63867b\");\n      label(\"BASE DEL PULGAR\", 459, 101, \"#dceeed\", 13);\n    } else if (step === 1) {\n      box(387, 38, 93, 63, 10, \"#13303a\", tone.soft);\n      line([[398, 69], [412, 69], [420, 60], [426, 77], [435, 51], [442, 69], [466, 69]], tone.accent, 2);\n      label(\"LATIDOS\", 432, 88, tone.accent);\n    } else {\n      box(320, 44, 163, 83, 13, \"#132c37\", tone.soft);\n      label(\"CUENTA DURANTE\", 401, 64, tone.accent);\n      label(\"1 MINUTO\", 401, 91, \"#e4fff9\", 22);\n    }\n  }\n\n  function temperature(tone, time) {\n    const close = step === 0 ? 0 : step === 2 ? .55 : .3 + .22 * Math.sin(time / 670) ** 2;\n    shape(torso, \"#253247\", \"#8299ae\");\n    line([[154, 57], [162, 70], [179, 74], [195, 70], [203, 58]], \"#678199\");\n    line([[127, 218], [236, 218]], \"#526982\");\n\n    ctx.save();\n    ctx.translate(235, 96);\n    ctx.rotate(close);\n    ctx.translate(-235, -96);\n    shape(arm, \"#624f50\", \"#c5a9a1\");\n    shape(sleeve, \"#344962\", \"#8299ae\");\n    ctx.restore();\n\n    if (step \u003c 2) {\n      const approach = step === 0 ? Math.sin(time / 500) ** 2 * 15 : 0;\n      ctx.save();\n      ctx.translate(241, 127 - approach);\n      ctx.rotate(.36 + close);\n      box(-5, -5, 25, 10, 5, \"#e3c9a3\", \"#fff0d6\");\n      box(12, -11, 96, 22, 9, \"#3a3337\", tone.accent);\n      box(58, -6, 34, 12, 3, \"#1f2432\", \"#a99181\");\n      ctx.restore();\n      signal(241, 127, tone, time ? (time % 1450) / 1450 : .35, 14);\n    }\n\n    if (step === 0) {\n      line([[143, 151], [177, 151], [225, 130]], tone.accent, 2);\n      box(56, 134, 87, 34, 4, \"#29291c\", tone.soft);\n      label(\"AXILA\", 99.5, 151, tone.accent, 14);\n    } else if (step === 1) {\n      line([[378, 190], [328, 185], [289, 173]], tone.accent, 2);\n      line([[301, 168], [289, 173], [298, 183]], tone.accent, 2);\n      label(\"ACERCA EL BRAZO\", 424, 218, tone.accent, 14);\n    } else {\n      box(324, 67, 153, 76, 11, tone.ink, tone.accent);\n      label(\"EJEMPLO\", 400, 87, tone.accent);\n      label(\"36,6 °C\", 400, 115, \"#fff2e0\", 24);\n    }\n  }\n\n  function astronaut(x, y, trim, skin) {\n    ctx.save();\n    ctx.translate(x, y);\n    const outline = \"#839a86\";\n    const suit = \"#e2edd1\";\n    box(-53, 9, 106, 61, 17, \"#59745d\", outline);\n    box(-43, 5, 86, 68, 17, suit, outline);\n    box(-22, 24, 44, 25, 5, trim, \"#5f785e\");\n    line([[-10, 36], [10, 36]], \"#eff5de\", 2.5);\n    box(-39, -56, 78, 75, 18, suit, outline);\n    box(-30, -45, 60, 50, 15, \"#254136\", \"#799582\");\n    box(-23, -38, 46, 38, 12, skin, \"#a18b70\");\n    ctx.fillStyle = \"#3f4237\";\n    ctx.fillRect(-10, -25, 3, 4);\n    ctx.fillRect(7, -25, 3, 4);\n    line([[-4, -13], [4, -13]], \"#674d40\", 1.8);\n    ctx.restore();\n  }\n\n  function supportPanel(x, y, w, text, tone) {\n    box(x, y, w, 30, 4, \"#153026\", tone.soft);\n    label(text, x + w / 2, y + 15, tone.accent, 14);\n  }\n\n  function radio(x, y, tone, phase) {\n    box(x, y, 76, 79, 9, \"#29483d\", tone.accent);\n    line([[x + 15, y], [x + 15, y - 22], [x + 22, y - 22]], tone.accent, 2.5);\n    box(x + 11, y + 13, 54, 25, 4, \"#11291f\", tone.soft);\n    line([[x + 17, y + 26], [x + 24, y + 26], [x + 30, y + 19], [x + 34, y + 29],\n      [x + 38, y + 23], [x + 57, y + 23]], tone.accent, 2);\n    signal(x + 38, y + 58, tone, phase, 8);\n  }\n\n  function restingCrew() {\n    box(163, 182, 294, 21, 8, \"#47695c\", \"#749485\");\n    box(167, 159, 63, 24, 9, \"#5c776a\", \"#77968b\");\n    box(219, 138, 146, 45, 18, \"#a6c2a5\", \"#d1e2be\");\n    box(328, 155, 112, 28, 11, \"#749682\", \"#a4bc9a\");\n    box(413, 145, 25, 36, 7, \"#bccdad\", \"#d1e2be\");\n    box(235, 161, 114, 16, 7, \"#bad0af\", \"#d1e2be\");\n    circle(203, 152, 23, \"#c79471\", \"#efd0a5\", 2);\n    line([[192, 146], [201, 146]], \"#4c4337\", 2);\n    line([[182, 146], [180, 152], [186, 153]], \"#e4b190\", 1.8);\n  }\n\n  function checkResponse(tone, phase) {\n    if (step \u003c 2) {\n      astronaut(125, 121, \"#4b754a\", \"#dec099\");
